<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>StreamWave Player Pro</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif'],
          },
          colors: {
            appDark: '#080b12',
            appCard: 'rgba(18, 24, 38, 0.72)',
            accentCyan: '#06b6d4',
            accentPurple: '#8b5cf6',
          }
        }
      }
    }
  </script>

  <style>
    /* Prevent inadvertent page pull-to-refresh & drag-down closures in iOS/Android WebViews */
    html, body {
      overscroll-behavior-y: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Target gesture zones so touches do not trigger Telegram modal collapse */
    .touch-trap {
      touch-action: pan-x pan-y;
    }
    .touch-control {
      touch-action: manipulation;
    }

    /* Glassmorphism */
    .glass-box {
      background: rgba(18, 24, 38, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Single Fluid Smooth Audio Visualizer Bar */
    .single-vis-container {
      position: relative;
      width: 100%;
      max-width: 280px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .single-smooth-bar {
      width: 80%;
      height: 4px;
      border-radius: 9999px;
      background: linear-gradient(90deg, #06b6d4, #8b5cf6, #ec4899, #06b6d4);
      background-size: 300% 100%;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.45);
      transform-origin: center;
      transform: scaleY(1);
      transition: transform 0.12s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.2s ease, width 0.3s ease;
      will-change: transform, box-shadow;
    }

    .single-smooth-bar.pulsing {
      box-shadow: 0 0 22px rgba(139, 92, 246, 0.8), 0 0 35px rgba(6, 182, 212, 0.5);
      animation: gradientShift 4s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Custom range slider for seeking */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 9999px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #06b6d4;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.85);
      cursor: pointer;
    }
    input[type=range]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #06b6d4;
      border: none;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.85);
      cursor: pointer;
    }

    /* Smooth animated Drawer */
    .drawer-open {
      transform: translateY(0%);
    }
    .drawer-closed {
      transform: translateY(100%);
    }
  </style>
</head>
<body class="bg-appDark text-slate-100 min-h-screen flex flex-col items-center p-3 selection:bg-cyan-500 selection:text-black">

  <!-- Ambient background glow elements -->
  <div class="fixed top-[-5%] left-[-10%] w-72 h-72 rounded-full bg-cyan-500/15 blur-[90px] pointer-events-none"></div>
  <div class="fixed top-[30%] right-[-10%] w-72 h-72 rounded-full bg-purple-600/15 blur-[100px] pointer-events-none"></div>

  <!-- Main Container -->
  <div class="w-full max-w-md flex flex-col gap-3 relative z-10 touch-trap pb-8">

    <!-- Header bar with Mode Switch & Download Trigger -->
    <header class="glass-box rounded-2xl px-3.5 py-2.5 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 p-[1.5px] flex items-center justify-center">
          <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
            <i class="ph ph-waveform text-cyan-400 text-base"></i>
          </div>
        </div>
        <div>
          <h1 class="text-xs font-bold font-display text-white tracking-wide">StreamWave</h1>
          <span class="text-[9px] text-cyan-400 font-medium tracking-wider uppercase">Pro Mini App</span>
        </div>
      </div>

      <!-- Mode Switch (Video / Audio) -->
      <div class="flex bg-slate-900/80 p-1 rounded-xl border border-white/10 touch-control">
        <button id="modeAudioBtn" onclick="switchMode('audio')" class="px-2.5 py-1 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all text-white bg-gradient-to-r from-cyan-500 to-purple-600 shadow-md">
          <i class="ph ph-headphones text-sm"></i>
          <span>Audio</span>
        </button>
        <button id="modeVideoBtn" onclick="switchMode('video')" class="px-2.5 py-1 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all text-slate-400 hover:text-slate-200">
          <i class="ph ph-video-camera text-sm"></i>
          <span>Video</span>
        </button>
      </div>

      <!-- Download Button Trigger -->
      <button onclick="openDownloadModal()" class="w-8 h-8 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-slate-300 hover:text-cyan-400 hover:border-cyan-500/40 transition-all active:scale-95 touch-control" title="Download Options">
        <i class="ph ph-download-simple text-base"></i>
      </button>
    </header>

    <!-- SECTION 1: TOP PLAYER DISPLAY (VIDEO / COVER ART + EQUALIZER) -->
    <div id="mediaBox" class="glass-box rounded-3xl p-3 border border-white/10 relative overflow-hidden flex flex-col touch-control shadow-2xl">

      <!-- TOP: VIDEO CONTAINER (16:9 Aspect Ratio) -->
      <div id="videoContainer" class="hidden w-full aspect-video rounded-2xl overflow-hidden bg-black relative border border-white/10 shadow-inner">
        <div id="ytPlayerContainer" class="w-full h-full"></div>
        <div class="absolute top-2 left-2 z-10 bg-black/60 backdrop-blur-md px-2 py-0.5 rounded-md text-[10px] text-cyan-300 flex items-center gap-1 border border-white/10 pointer-events-none">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          HD Stream
        </div>
      </div>

      <!-- TOP: AUDIO DISPLAY (Cover Art + Multi-Bar Equalizer) -->
      <div id="audioContainer" class="w-full flex flex-col items-center justify-center py-4 relative">
        <div class="relative w-36 h-36 rounded-2xl overflow-hidden border-2 border-white/15 shadow-2xl shadow-cyan-950/40">
          <img id="currentArtwork" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=400&q=80" alt="Cover" class="w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent"></div>
          <div class="absolute bottom-1.5 left-2 flex items-center gap-1 text-[10px] text-cyan-300 font-medium">
            <i class="ph ph-music-notes"></i>
            <span>Audio Mode</span>
          </div>
        </div>

        <!-- Single Ultra-Smooth Dynamic Fluid Visualizer -->
        <div class="single-vis-container mt-4">
          <div id="singleVisBar" class="single-smooth-bar"></div>
        </div>
      </div>

      <!-- SECTION 2: TIMING STATUS & SEEK SCRUBBER -->
      <div class="w-full px-2 mt-2 touch-control">
        <div class="relative flex items-center py-1">
          <input 
            type="range" 
            id="timelineScrubber" 
            value="0" 
            min="0" 
            max="100" 
            step="0.1" 
            class="w-full h-1.5 cursor-pointer accent-cyan-400"
          >
        </div>
        <div class="flex justify-between text-[11px] font-mono text-slate-400 mt-0.5">
          <span id="elapsedTime">0:00</span>
          <span id="totalDuration">0:00</span>
        </div>
      </div>

      <!-- SECTION 3: TRACK METADATA -->
      <div class="text-center px-3 mt-1">
        <h2 id="trackTitle" class="text-sm font-bold text-white truncate font-display">Midnight City Lights</h2>
        <p id="trackArtist" class="text-xs text-slate-400 truncate mt-0.5">Synthwave Chill Vibes</p>
      </div>

      <!-- SECTION 4: PLAYBACK CONTROLS -->
      <div class="flex items-center justify-between px-4 mt-3">
        <!-- Shuffle Toggle -->
        <button id="shuffleBtn" onclick="toggleShuffle()" class="text-slate-400 hover:text-cyan-400 transition-colors p-2 text-lg touch-control active:scale-90" title="Shuffle">
          <i class="ph ph-shuffle"></i>
        </button>

        <!-- Previous Track -->
        <button onclick="playPrev()" class="text-slate-300 hover:text-white transition-all p-2 text-xl touch-control active:scale-90" title="Previous">
          <i class="ph ph-skip-back-bold"></i>
        </button>

        <!-- Play / Pause Main Button -->
        <button id="mainPlayBtn" onclick="togglePlay()" class="w-13 h-13 p-3.5 rounded-full bg-gradient-to-tr from-cyan-500 to-purple-600 text-white flex items-center justify-center shadow-lg shadow-cyan-500/30 hover:scale-105 active:scale-95 transition-all touch-control" title="Play/Pause">
          <i id="playIcon" class="ph ph-play-fill text-2xl ml-0.5"></i>
        </button>

        <!-- Next Track -->
        <button onclick="playNext()" class="text-slate-300 hover:text-white transition-all p-2 text-xl touch-control active:scale-90" title="Next">
          <i class="ph ph-skip-forward-bold"></i>
        </button>

        <!-- Repeat Mode -->
        <button id="repeatBtn" onclick="toggleRepeat()" class="text-slate-400 hover:text-purple-400 transition-colors p-2 text-lg relative touch-control active:scale-90" title="Repeat Mode">
          <i id="repeatIcon" class="ph ph-repeat"></i>
          <span id="repeatBadge" class="hidden absolute top-1 right-1 text-[8px] font-bold bg-purple-500 text-white rounded-full w-3.5 h-3.5 flex items-center justify-center leading-none">1</span>
        </button>
      </div>

      <!-- Quick Volume & Mute Row -->
      <div class="flex items-center justify-between px-3 mt-3 pt-2.5 border-t border-white/5 text-xs text-slate-400">
        <button id="muteToggleBtn" onclick="toggleMute()" class="flex items-center gap-1.5 hover:text-cyan-400 transition-colors touch-control">
          <i id="volumeIcon" class="ph ph-speaker-high text-sm"></i>
          <span class="text-[10px]">Volume</span>
        </button>
        <div class="flex items-center gap-2 w-32">
          <input type="range" id="volumeSlider" min="0" max="100" value="90" class="w-full h-1 touch-control">
        </div>
      </div>
    </div>

    <!-- SEARCH & YOUTUBE LINK / ID INPUT -->
    <div class="glass-box rounded-2xl p-2 flex flex-col gap-2 border border-white/10 touch-control">
      <div class="flex items-center gap-1.5">
        <div class="relative flex-1">
          <i class="ph ph-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
          <input 
            id="ytInput" 
            type="text" 
            placeholder="Paste link or search song/artist..." 
            oninput="handleSearchFilter(this.value)"
            class="w-full bg-slate-900/60 rounded-xl pl-8 pr-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-cyan-500 border border-white/5"
          >
        </div>
        <button onclick="handleUrlOrSearch()" class="px-3 py-2 bg-gradient-to-r from-cyan-500 to-purple-600 hover:opacity-90 text-white text-xs font-semibold rounded-xl transition-all active:scale-95 touch-control flex items-center gap-1">
          <i class="ph ph-plus-circle text-sm"></i>
          <span>Add</span>
        </button>
      </div>

      <!-- Category Filter Chips -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 text-[10px]">
        <button onclick="filterCategory('All')" class="cat-pill px-2.5 py-1 rounded-lg bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 font-medium">All (20+)</button>
        <button onclick="filterCategory('Bollywood')" class="cat-pill px-2.5 py-1 rounded-lg bg-white/5 text-slate-400 hover:text-white border border-white/5">Bollywood</button>
        <button onclick="filterCategory('Chill')" class="cat-pill px-2.5 py-1 rounded-lg bg-white/5 text-slate-400 hover:text-white border border-white/5">Chill / Lofi</button>
        <button onclick="filterCategory('Synthwave')" class="cat-pill px-2.5 py-1 rounded-lg bg-white/5 text-slate-400 hover:text-white border border-white/5">Synthwave</button>
        <button onclick="filterCategory('EDM')" class="cat-pill px-2.5 py-1 rounded-lg bg-white/5 text-slate-400 hover:text-white border border-white/5">EDM</button>
      </div>
    </div>

    <!-- SECTION 5: COMPACT QUEUE (Shows next 3 songs + Full Window Button) -->
    <div class="glass-box rounded-2xl p-3 border border-white/10 touch-control">
      <div class="flex items-center justify-between mb-2 px-1">
        <div class="flex items-center gap-1.5">
          <i class="ph ph-queue text-cyan-400 text-sm"></i>
          <h3 class="text-xs font-bold text-white uppercase tracking-wider">Next In Queue</h3>
        </div>
        <!-- Expand / Full Window Queue Button -->
        <button onclick="openFullQueue()" class="text-[11px] font-semibold text-cyan-400 hover:text-cyan-300 flex items-center gap-1 bg-cyan-950/40 px-2 py-0.5 rounded-lg border border-cyan-500/30 active:scale-95 transition-all touch-control">
          <i class="ph ph-arrows-out-simple"></i>
          <span id="compactQueueCountBtn">Full Queue (20)</span>
        </button>
      </div>

      <!-- 3 Next Upcoming Songs -->
      <div id="compactQueueList" class="space-y-1.5">
        <!-- Injected via JavaScript -->
      </div>
    </div>

  </div>

  <!-- FULL WINDOW QUEUE DRAWER / MODAL -->
  <div id="fullQueueDrawer" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-xl flex flex-col justify-end transition-all duration-300 drawer-closed">
    <div class="bg-slate-900 border-t border-white/15 rounded-t-3xl h-[88vh] flex flex-col p-4 touch-trap shadow-2xl max-w-md mx-auto w-full">
      <!-- Drawer Header -->
      <div class="flex items-center justify-between pb-3 border-b border-white/10">
        <div class="flex items-center gap-2">
          <i class="ph ph-playlist text-cyan-400 text-lg"></i>
          <div>
            <h2 class="text-sm font-bold text-white font-display">Extensive Playlist & Queue</h2>
            <p id="totalQueueBadge" class="text-[10px] text-slate-400">Loading songs...</p>
          </div>
        </div>
        <!-- Close Window Button -->
        <button onclick="closeFullQueue()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-slate-300 hover:text-rose-400 transition-colors touch-control active:scale-95" title="Close Queue">
          <i class="ph ph-x-bold text-sm"></i>
        </button>
      </div>

      <!-- Live Search within Queue -->
      <div class="pt-2">
        <input 
          id="queueSearchInput"
          type="text" 
          placeholder="Filter queue by title or artist..." 
          oninput="filterDrawerQueue(this.value)"
          class="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500/50"
        >
      </div>

      <!-- Queue Songs List (Scrollable) -->
      <div id="fullQueueList" class="flex-1 overflow-y-auto py-2 space-y-2 mt-2 pr-1">
        <!-- Rendered via JavaScript -->
      </div>
    </div>
  </div>

  <!-- DOWNLOAD MODAL (Audio & Video Formats) -->
  <div id="downloadModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="glass-box rounded-3xl p-5 max-w-sm w-full border border-white/15 shadow-2xl relative touch-trap">
      <div class="flex items-center justify-between pb-3 border-b border-white/10">
        <div class="flex items-center gap-2">
          <i class="ph ph-cloud-arrow-down text-cyan-400 text-xl"></i>
          <h3 class="text-sm font-bold text-white font-display">Download Options</h3>
        </div>
        <button onclick="closeDownloadModal()" class="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-slate-300 hover:text-white touch-control">
          <i class="ph ph-x"></i>
        </button>
      </div>

      <!-- Current track to download -->
      <div class="my-3 px-2.5 py-2 rounded-xl bg-white/5 border border-white/5">
        <p id="dlTrackName" class="text-xs font-bold text-cyan-300 truncate">Song Name</p>
        <p class="text-[10px] text-slate-400">Available YouTube Media Streams</p>
      </div>

      <!-- Video Formats -->
      <div class="space-y-1.5 mb-3">
        <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Video Formats (MP4)</span>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="triggerDownload('video', '1080p')" class="p-2 rounded-xl bg-slate-800/80 border border-white/10 text-center hover:border-cyan-400 transition-all touch-control active:scale-95">
            <span class="block text-xs font-bold text-white">1080p</span>
            <span class="text-[9px] text-cyan-400">FHD MP4</span>
          </button>
          <button onclick="triggerDownload('video', '720p')" class="p-2 rounded-xl bg-slate-800/80 border border-white/10 text-center hover:border-cyan-400 transition-all touch-control active:scale-95">
            <span class="block text-xs font-bold text-white">720p</span>
            <span class="text-[9px] text-cyan-400">HD MP4</span>
          </button>
          <button onclick="triggerDownload('video', '360p')" class="p-2 rounded-xl bg-slate-800/80 border border-white/10 text-center hover:border-cyan-400 transition-all touch-control active:scale-95">
            <span class="block text-xs font-bold text-white">360p</span>
            <span class="text-[9px] text-slate-400">SD Fast</span>
          </button>
        </div>
      </div>

      <!-- Audio Formats -->
      <div class="space-y-1.5">
        <span class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">Audio Formats</span>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="triggerDownload('audio', '320kbps')" class="p-2 rounded-xl bg-slate-800/80 border border-white/10 text-center hover:border-purple-400 transition-all touch-control active:scale-95">
            <span class="block text-xs font-bold text-white">320k</span>
            <span class="text-[9px] text-purple-300">MP3 HQ</span>
          </button>
          <button onclick="triggerDownload('audio', 'M4A')" class="p-2 rounded-xl bg-slate-800/80 border border-white/10 text-center hover:border-purple-400 transition-all touch-control active:scale-95">
            <span class="block text-xs font-bold text-white">M4A</span>
            <span class="text-[9px] text-purple-300">AAC Clean</span>
          </button>
          <button onclick="triggerDownload('audio', 'FLAC')" class="p-2 rounded-xl bg-slate-800/80 border border-white/10 text-center hover:border-purple-400 transition-all touch-control active:scale-95">
            <span class="block text-xs font-bold text-white">FLAC</span>
            <span class="text-[9px] text-purple-300">Lossless</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/95 border border-cyan-500/40 text-white text-xs px-4 py-2 rounded-full shadow-2xl backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center gap-1.5">
    <i class="ph ph-info text-cyan-400 text-sm"></i>
    <span id="toastText">Action completed</span>
  </div>

  <!-- Load YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    // --- 1. TELEGRAM WEBAPP INITIALIZATION & ACCIDENTAL CLOSING FIX ---
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (typeof tg.enableClosingConfirmation === 'function') {
        tg.enableClosingConfirmation();
      }
      if (typeof tg.setHeaderColor === 'function') {
        tg.setHeaderColor('#080b12');

    // Stop propagation on inputs/controls to prevent swipe dismiss
    document.querySelectorAll('.touch-control, input[type=range], button').forEach(el => {
      el.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
      el.addEventListener('touchmove', (e) => e.stopPropagation(), { passive: true });

      { id: "JGwWNGJdvx8", title: "Shape of You", artist: "Ed Sheeran", category: "Hits", cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&q=80" },
      { id: "k4yXQkG2s1E", title: "Dhurandhar Sound Experience", artist: "Ambient Orchestra", category: "Synthwave", cover: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=400&q=80" },
      { id: "Iltsbc5nh1c", title: "Kahani Suno 2.0", artist: "Kaifi Khalil", category: "Bollywood", cover: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=400&q=80" },
      { id: "L_XJ_s5IsQc", title: "Kesariya (Brahmāstra)", artist: "Arijit Singh • Pritam", category: "Bollywood", cover: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400&q=80" },
      { id: "H5v3kku4y6Q", title: "Raataan Lambiyan", artist: "Jubin Nautiyal • Asees Kaur", category: "Bollywood", cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&q=80" },

    // --- 3. YOUTUBE PLAYER CONFIGURATION & STRICT NON-AUTO-SKIPPING FIX ---
    window.onYouTubeIframeAPIReady = function() {
      const currentHost = (window.location.origin && window.location.origin !== "null") 
        ? window.location.origin 
        : "https://xandar98.github.io";

      ytPlayer = new YT.Player('ytPlayerContainer', {
        height: '100%',
        width: '100%',
        host: 'https://www.youtube-nocookie.com',
        videoId: queue[currentIndex].id,
        playerVars: {
          autoplay: 0,
          controls: 1,
          rel: 0,
          modestbranding: 1,
          playsinline: 1,
          enablejsapi: 1,
          origin: currentHost
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    };

    // Safe error handler: Do NOT auto-skip immediately on initialization buffering
    function onPlayerError(event) {
      console.warn("YouTube Player error encountered:", event.data);
      // Only inform user, do not auto-force next track without interaction
      showToast("Video playback issue with this track.");
      setPlayingUI(false);
    }

    function onPlayerReady() {
      updateDisplayMetadata();
      renderQueueUI();
    }

    // STRICT: Only advance or change track when ENDED (0) occurs, never on buffering or unstarted
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        setPlayingUI(true);
      } else if (event.data === YT.PlayerState.PAUSED) {
        setPlayingUI(false);
      } else if (event.data === YT.PlayerState.ENDED) {
        // Natural end of song
        handleTrackEnd();
      }
    }

    function handleTrackEnd() {
      if (repeatMode === 2) {
        ytPlayer.seekTo(0);
        ytPlayer.playVideo();
      } else if (repeatMode === 1) {
        playNext();
      } else {
        if (currentIndex < queue.length - 1) {
          playNext();
        } else {
          setPlayingUI(false);
        }
      }
    }

    function setPlayingUI(playing) {
      isPlaying = playing;
      if (playing) {
        playIcon.className = "ph ph-pause-fill text-2xl";
        startTracking();
        startSingleVisualizer();
      } else {
        playIcon.className = "ph ph-play-fill text-2xl ml-0.5";
        clearInterval(progressTimer);
        stopSingleVisualizer();
      }
      renderQueueUI();
    }

    function togglePlay() {
      if (!ytPlayer || typeof ytPlayer.playVideo !== 'function') return;
      if (isPlaying) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    }

    // Load track ONLY when explicitly selected or on natural track end
    function loadTrack(index, autoPlay = true) {
      if (index < 0) index = queue.length - 1;
      if (index >= queue.length) index = 0;
      currentIndex = index;

      updateDisplayMetadata();

      if (ytPlayer && ytPlayer.loadVideoById) {
        try {
          if (autoPlay) {
            ytPlayer.loadVideoById({
              videoId: queue[currentIndex].id,
              suggestedQuality: 'small'
            });
            setPlayingUI(true);
          } else {
            ytPlayer.cueVideoById(queue[currentIndex].id);
            setPlayingUI(false);
          }
        } catch (e) {
          console.error(e);
        }
      }
      renderQueueUI();
    }

    function playNext() {
      if (isShuffle) {
        const rand = Math.floor(Math.random() * queue.length);
        loadTrack(rand, true);
      } else {
        loadTrack(currentIndex + 1, true);
      }
    }

    function playPrev() {
      loadTrack(currentIndex - 1, true);
    }

    // --- INFINITE QUEUE SUGGESTION GENERATOR (APPEND WITHOUT AUTO-PLAY) ---
    function loadMoreSuggestions() {
      // Pick next batch of suggestions from the dynamic pool
      const unusedPool = dynamicRecommendationBank.filter(bankItem => 
        !queue.some(q => q.id === bankItem.id)
      );

      const itemsToAdd = (unusedPool.length >= 8) 
        ? unusedPool.slice(0, 8) 
        : dynamicRecommendationBank.slice(0, 8);

      itemsToAdd.forEach(item => {
        queue.push({ ...item, id: item.id });
      });

      filteredQueue = [...queue];
      renderQueueUI();
      showToast(`Added ${itemsToAdd.length} more suggestions to queue!`);
    }

    function updateDisplayMetadata() {
      const cur = queue[currentIndex];
      if (!cur) return;
      trackTitle.textContent = cur.title;
      trackArtist.textContent = cur.artist;
      currentArtwork.src = cur.cover;
      document.getElementById('dlTrackName').textContent = cur.title;
    }

    // --- 4. SEEK / PROGRESS BAR ---
    function startTracking() {
      clearInterval(progressTimer);
      progressTimer = setInterval(() => {
        if (!ytPlayer || !ytPlayer.getDuration) return;
        const current = ytPlayer.getCurrentTime();
        const duration = ytPlayer.getDuration();
        if (duration > 0) {
          timelineScrubber.value = (current / duration) * 100;
          elapsedTime.textContent = formatTime(current);
          totalDuration.textContent = formatTime(duration);
        }
      }, 500);
    }

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    timelineScrubber.addEventListener('input', (e) => {
      if (!ytPlayer || !ytPlayer.getDuration) return;
      const targetSec = (e.target.value / 100) * ytPlayer.getDuration();
      ytPlayer.seekTo(targetSec, true);
      elapsedTime.textContent = formatTime(targetSec);
    });

    // --- 5. ULTRA-SMOOTH SINGLE FLUID VISUALIZER BAR (Up & Down Pulse) ---
    function startSingleVisualizer() {
      if (visualizerAnimFrame) cancelAnimationFrame(visualizerAnimFrame);
      if (singleVisBar) singleVisBar.classList.add('pulsing');

      function animate() {
        visPhase += 0.08;
        // Smooth compounding sine wave for natural organic up-and-down breathing
        const wave = Math.sin(visPhase) * 0.5 + Math.sin(visPhase * 2.3) * 0.3 + 1.2;
        const scaleY = Math.max(1, wave * 2.6); // Scale thickness smoothly from 1x to 4.5x
        const scaleX = 0.85 + (Math.sin(visPhase * 1.5) * 0.08); // Slight organic horizontal flex

        if (singleVisBar) {
          singleVisBar.style.transform = `scale(${scaleX}, ${scaleY})`;
        }
        visualizerAnimFrame = requestAnimationFrame(animate);
      }

      animate();
    }

    function stopSingleVisualizer() {
      if (visualizerAnimFrame) {
        cancelAnimationFrame(visualizerAnimFrame);
        visualizerAnimFrame = null;
      }
      if (singleVisBar) {
        singleVisBar.classList.remove('pulsing');
        singleVisBar.style.transform = 'scale(0.85, 1)';
      }
    }

    function toggleRepeat() {
      repeatMode = (repeatMode + 1) % 3;
      if (repeatMode === 0) {
        repeatBtn.classList.remove('text-purple-400');
        repeatBtn.classList.add('text-slate-400');
        repeatBadge.classList.add('hidden');

        repeatBadge.classList.add('hidden');

        repeatBadge.classList.remove('hidden');

    volumeSlider.addEventListener('input', (e) => {
      const val = e.target.value;

        ytPlayer.setVolume(val);

      volumeIcon.className = val == 0 ? "ph ph-speaker-x text-sm text-rose-400" : "ph ph-speaker-high text-sm";

    function toggleMute() {
      if (!ytPlayer) return;
      if (isMuted) {

    // --- 9. SEARCH & CATEGORY FILTERING ---
    function filterCategory(cat) {
      document.querySelectorAll('.cat-pill').forEach(btn => {
        btn.className = "cat-pill px-2.5 py-1 rounded-lg bg-white/5 text-slate-400 hover:text-white border border-white/5";
      });
      event.target.className = "cat-pill px-2.5 py-1 rounded-lg bg-cyan-500/20 text-cyan-300 border border-cyan-500/40 font-medium";

      if (cat === 'All') {
        filteredQueue = [...queue];
      } else {
        filteredQueue = queue.filter(q => q.category === cat);
      }
      renderQueueUI();
      showToast(`Showing ${cat} tracks`);
    }

    function handleSearchFilter(term) {
      const q = term.toLowerCase().trim();
      if (!q) {
        filteredQueue = [...queue];
      } else {
        filteredQueue = queue.filter(item => 
          item.title.toLowerCase().includes(q) || 
          item.artist.toLowerCase().includes(q)
        );
      }
      renderQueueUI();
    }

    function filterDrawerQueue(term) {
      const q = term.toLowerCase().trim();
      const items = document.querySelectorAll('#fullQueueList > div');
      items.forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.includes(q) ? 'flex' : 'none';
      });
    }

    // --- 10. QUEUE RENDERING, ACTIONS & INFINITE SCROLL ---
    function renderQueueUI() {
      const compactList = document.getElementById('compactQueueList');
      const fullList = document.getElementById('fullQueueList');
      document.getElementById('totalQueueBadge').textContent = `${queue.length} Songs in Queue & Suggestions`;
      document.getElementById('compactQueueCountBtn').textContent = `Full Queue (${queue.length})`;

      // 1. Next 3 Upcoming in Queue
      compactList.innerHTML = '';
      const upcoming = [];
      for (let i = 1; i <= 3; i++) {
        const nextIdx = (currentIndex + i) % queue.length;
        if (queue.length > 1 && !upcoming.includes(nextIdx) && nextIdx !== currentIndex) {
          upcoming.push(nextIdx);
        }
      }

      if (upcoming.length === 0) {
        compactList.innerHTML = `<p class="text-[11px] text-slate-500 py-1 text-center">No other songs in queue</p>`;
      } else {
        upcoming.forEach(idx => {
          const item = queue[idx];
          const div = document.createElement('div');
          div.className = "flex items-center justify-between p-2 rounded-xl bg-white/5 border border-white/5 hover:bg-white/10 transition-all touch-control";
          div.innerHTML = `
            <div class="flex items-center gap-2.5 overflow-hidden">
              <img src="${item.cover}" class="w-8 h-8 rounded-lg object-cover flex-shrink-0">
              <div class="truncate">
                <p class="text-xs font-semibold text-slate-200 truncate">${item.title}</p>
                <p class="text-[10px] text-slate-400 truncate">${item.artist}</p>
              </div>
            </div>
            <div class="flex items-center gap-1.5 flex-shrink-0">
              <button onclick="playNextInQueue(${idx})" class="p-1.5 hover:text-cyan-400 text-slate-400 text-xs" title="Play Next">
                <i class="ph ph-arrow-bend-double-up-right"></i>
              </button>
              <button onclick="loadTrack(${idx}, true)" class="w-7 h-7 rounded-lg bg-cyan-500/20 text-cyan-300 flex items-center justify-center text-xs">
                <i class="ph ph-play-fill"></i>
              </button>
            </div>
          `;
          compactList.appendChild(div);
        });
      }

      // 2. Full Drawer Queue List
      fullList.innerHTML = '';
      filteredQueue.forEach((item, idx) => {
        const actualIdx = queue.findIndex(q => q.id === item.id);
        const isCurrent = actualIdx === currentIndex;
        const div = document.createElement('div');
        div.className = `p-2.5 rounded-2xl flex items-center justify-between border transition-all ${
          isCurrent 
            ? 'bg-cyan-950/40 border-cyan-500/50 shadow-lg' 
            : 'bg-white/5 border-white/5 hover:border-white/10'
        }`;

        div.innerHTML = `
          <div class="flex items-center gap-3 overflow-hidden flex-1 cursor-pointer" onclick="loadTrack(${actualIdx}, true); closeFullQueue();">
            <img src="${item.cover}" class="w-10 h-10 rounded-xl object-cover flex-shrink-0">
            <div class="truncate">
              <p class="text-xs font-bold ${isCurrent ? 'text-cyan-300' : 'text-slate-200'} truncate">${item.title}</p>
              <p class="text-[10px] text-slate-400 truncate">${item.artist}</p>
            </div>
          </div>
          <div class="flex items-center gap-2 flex-shrink-0">
            ${!isCurrent ? `
              <button onclick="playNextInQueue(${actualIdx})" class="p-1.5 text-slate-400 hover:text-cyan-400" title="Play Next">
                <i class="ph ph-arrow-line-up text-sm"></i>
              </button>
              <button onclick="removeSong(${actualIdx})" class="p-1.5 text-slate-400 hover:text-rose-400" title="Remove">
                <i class="ph ph-trash text-sm"></i>
              </button>
            ` : `
              <span class="text-[10px] font-bold text-cyan-400 bg-cyan-500/10 px-2 py-0.5 rounded-full border border-cyan-500/30">Playing</span>
            `}
          </div>
        `;
        fullList.appendChild(div);
      });

      // Append "Load More Suggestions" action element at the bottom of the list
      const loadMoreContainer = document.createElement('div');
      loadMoreContainer.className = "py-3 flex justify-center";
      loadMoreContainer.innerHTML = `
        <button onclick="loadMoreSuggestions()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-cyan-500/20 to-purple-600/20 hover:from-cyan-500/30 hover:to-purple-600/30 border border-cyan-500/40 text-cyan-300 text-xs font-bold flex items-center gap-2 transition-all active:scale-95">
          <i class="ph ph-plus-circle text-base"></i>
          <span>Load More Suggested Songs</span>
        </button>
      `;
      fullList.appendChild(loadMoreContainer);
    }

    // Scroll listener on Full Queue Drawer for automatic infinite loading on scroll
    const fullQueueContainer = document.getElementById('fullQueueList');
    if (fullQueueContainer) {
      fullQueueContainer.addEventListener('scroll', () => {
        if (fullQueueContainer.scrollTop + fullQueueContainer.clientHeight >= fullQueueContainer.scrollHeight - 30) {
          loadMoreSuggestions();
        }
      });
    }

    function playNextInQueue(idx) {
      if (idx === currentIndex) return;
      const song = queue.splice(idx, 1)[0];
      const targetPos = (currentIndex < idx) ? currentIndex + 1 : currentIndex;
      queue.splice(targetPos, 0, song);
      filteredQueue = [...queue];
      renderQueueUI();
      showToast(`"${song.title.substring(0, 16)}..." will play next`);
    }

    function removeSong(idx) {
      if (queue.length <= 1) {
        showToast("Queue requires at least 1 track");
        return;
      }
      const removed = queue.splice(idx, 1)[0];
      if (idx < currentIndex) {
        currentIndex--;
      }
      filteredQueue = [...queue];
      renderQueueUI();
      showToast(`Removed "${removed.title.substring(0, 16)}..."`);
    }

    function openFullQueue() {
      const drawer = document.getElementById('fullQueueDrawer');
      drawer.classList.remove('drawer-closed');
      drawer.classList.add('drawer-open');
    }

    function closeFullQueue() {
      const drawer = document.getElementById('fullQueueDrawer');
      drawer.classList.remove('drawer-open');
      drawer.classList.add('drawer-closed');
    }

    // --- 11. DYNAMIC URL IMPORT & CUSTOM SEARCH ---
    function handleUrlOrSearch() {
      const val = document.getElementById('ytInput').value.trim();
      if (!val) return;

      let videoId = val;
      const ytRegex = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/;
      const match = val.match(ytRegex);
      if (match && match[1]) {
        videoId = match[1];
      }

      const newSong = {
        id: videoId,
        title: val.length > 25 ? "Imported YouTube Stream" : val,
        artist: "YouTube Stream",
        category: "Hits",
        cover: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`
      };

      queue.splice(currentIndex + 1, 0, newSong);
      filteredQueue = [...queue];
      document.getElementById('ytInput').value = '';
      loadTrack(currentIndex + 1, true);
      showToast("Added and playing stream!");
    }

    // --- 12. DOWNLOAD MODAL ---
    function openDownloadModal() {
      document.getElementById('downloadModal').classList.remove('hidden');
      document.getElementById('downloadModal').classList.add('flex');
    }

    function closeDownloadModal() {
      document.getElementById('downloadModal').classList.add('hidden');
      document.getElementById('downloadModal').classList.remove('flex');
    }

    function triggerDownload(type, quality) {
      const cur = queue[currentIndex];
      closeDownloadModal();
      showToast(`Opening download link for ${quality}...`);

      const targetUrl = `https://www.y2mate.com/youtube/${cur.id}`;
      if (tg && typeof tg.openLink === 'function') {
        tg.openLink(targetUrl);
      } else {
        window.open(targetUrl, '_blank');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastText').textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2400);
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateDisplayMetadata();
      renderQueueUI();
    });
  </script>
</body>
</html>
