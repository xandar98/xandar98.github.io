<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Nokia XpressMusic S60v5 Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --s60-chassis: #12151b;
      --s60-bezel: #1e2430;
      --s60-screen: #0a0e14;
      --s60-red: #e02424; /* XpressMusic Red Accent */
      --s60-blue: #0088ff;
      --s60-cyan: #00d2ff;
      --s60-text: #f0f4f8;
      --s60-subtext: #889bb0;
      --touch-bg: rgba(255, 255, 255, 0.05);
      --touch-border: rgba(0, 136, 255, 0.25);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 12px;
      min-height: 100vh;
      background: #05070a;
      color: var(--s60-text);
      font-family: "Tahoma", "Lucida Grande", "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* All-Glass Touchscreen Bezel */
    .touch-device {
      width: 100%;
      max-width: 370px;
      background: var(--s60-chassis);
      border: 3px solid #2d3748;
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.95), 0 0 15px rgba(224, 36, 36, 0.15);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Top Branding & Sensor Area */
    .top-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 6px;
      border-bottom: 2px solid var(--s60-red);
      padding-bottom: 8px;
    }
    .brand-logo {
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 2px;
      color: #cbd5e1;
    }
    .xpress-tag {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--s60-red);
      letter-spacing: 0.5px;
    }

    /* Full Touchscreen Container */
    .touch-screen {
      background: var(--s60-screen);
      border: 1px solid #1a2332;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    /* S60 Touch Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--s60-cyan);
      border-bottom: 1px solid #141e2c;
      padding-bottom: 4px;
      font-weight: 600;
    }

    /* Track Metadata Display */
    .track-panel {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid #172435;
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }
    .marquee-wrapper {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      display: flex;
      justify-content: center;
    }
    .track-title {
      display: inline-block;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
    }
    .marquee-active {
      display: inline-flex;
      animation: marqueeSlide 10s linear infinite;
    }
    @keyframes marqueeSlide {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .track-meta {
      font-size: 0.72rem;
      color: var(--s60-cyan);
      margin-top: 4px;
    }

    /* Seeking / Progress Bar */
    .progress-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .progress-bar-container {
      width: 100%;
      height: 22px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
    }
    .progress-track {
      width: 100%;
      height: 7px;
      background: #141c27;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      border: 1px solid #223247;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0088ff, #00d2ff);
      pointer-events: none;
    }
    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--s60-subtext);
      font-family: monospace;
    }

    /* On-Screen Touch Playback Controls */
    .touch-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      padding: 4px 0;
    }
    .touch-btn {
      background: var(--touch-bg);
      border: 1px solid var(--touch-border);
      color: var(--s60-text);
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.1s, transform 0.1s;
    }
    .touch-btn svg {
      width: 18px;
      height: 18px;
      fill: #e2e8f0;
    }
    .touch-btn:active {
      transform: scale(0.92);
      background: rgba(0, 136, 255, 0.25);
      border-color: var(--s60-cyan);
    }
    .touch-btn-play {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, rgba(0, 136, 255, 0.3), rgba(0, 210, 255, 0.2));
      border: 1px solid var(--s60-cyan);
      box-shadow: 0 0 12px rgba(0, 136, 255, 0.3);
    }
    .touch-btn-play svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }

    /* On-Screen Touch Volume Bar */
    .touch-volume-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid #162232;
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .vol-icon {
      font-size: 0.8rem;
      cursor: pointer;
    }
    .vol-text {
      font-size: 0.7rem;
      font-family: monospace;
      color: var(--s60-cyan);
      min-width: 36px;
      text-align: right;
    }

    /* 3-Band Equalizer LCD Screen */
    .eq-screen-box {
      background: #06090e;
      border: 1px solid #162230;
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .eq-screen-title {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--s60-cyan);
      text-transform: uppercase;
    }
    .eq-slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .eq-name {
      font-size: 0.7rem;
      color: var(--s60-subtext);
      width: 44px;
    }
    .eq-val {
      font-size: 0.7rem;
      color: var(--s60-red);
      width: 34px;
      text-align: right;
      font-family: monospace;
    }
    input[type="range"] {
      flex: 1;
      height: 5px;
      background: #172230;
      border-radius: 3px;
      outline: none;
      accent-color: var(--s60-blue);
      cursor: pointer;
    }

    /* Touch Softkeys Bar (File Open & Stop) */
    .touch-softkeys {
      display: flex;
      gap: 8px;
    }
    .touch-action-btn {
      flex: 1;
      padding: 9px;
      background: var(--touch-bg);
      border: 1px solid #203045;
      border-radius: 8px;
      color: var(--s60-cyan);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      text-align: center;
    }
    .touch-action-btn:active {
      background: rgba(0, 136, 255, 0.2);
      border-color: var(--s60-blue);
    }
    #audioInput {
      display: none;
    }
  </style>
</head>
<body>

  <div class="touch-device">
    <!-- Top Branding -->
    <div class="top-panel">
      <span class="brand-logo">NOKIA</span>
      <span class="xpress-tag">XpressMusic Touch</span>
    </div>

    <!-- Main Touchscreen Display -->
    <div class="touch-screen">
      <!-- Top Status Header -->
      <div class="status-bar">
        <span>📶 3.5G HSDPA</span>
        <span>TOUCH PLAYER</span>
        <span id="screenBattery">🔋 100%</span>
      </div>

      <!-- Track Information Screen -->
      <div class="track-panel">
        <div class="marquee-wrapper" id="marqueeWrapper">
          <span class="track-title" id="trackName">Touch to Select Audio</span>
        </div>
        <div class="track-meta" id="trackIndex">Local Storage or Chat Stream</div>
      </div>

      <audio id="audioElement" playsinline crossorigin="anonymous"></audio>

      <!-- Timing / Progress Bar -->
      <div class="progress-box">
        <div class="progress-bar-container" id="progressContainer">
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
        <div class="time-labels">
          <span id="currentTime">00:00</span>
          <span id="totalDuration">00:00</span>
        </div>
      </div>

      <!-- Touch Playback Controls (All Inside Screen) -->
      <div class="touch-controls">
        <button class="touch-btn" id="prevBtn" title="Previous Track">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>

        <button class="touch-btn touch-btn-play" id="playPauseBtn" title="Play / Pause">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button class="touch-btn" id="stopBtn" title="Stop">
          <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        </button>

        <button class="touch-btn" id="nextBtn" title="Next Track">
          <svg viewBox="0 0 24 24"><path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

      <!-- Touch Volume Slider -->
      <div class="touch-volume-box">
        <span class="vol-icon" id="volIcon">🔊</span>
        <input type="range" id="volSlider" min="0" max="1" step="0.01" value="1">
        <span class="vol-text" id="volText">100%</span>
      </div>

      <!-- Symbian Touch Equalizer Box -->
      <div class="eq-screen-box">
        <div class="eq-screen-title">
          <span>Manual Equalizer</span>
          <span>DSP Active</span>
        </div>

        <div class="eq-slider-row">
          <span class="eq-name">Bass</span>
          <input type="range" id="bassSlider" min="-12" max="12" value="0" step="1">
          <span class="eq-val" id="bassVal">0dB</span>
        </div>

        <div class="eq-slider-row">
          <span class="eq-name">Mid</span>
          <input type="range" id="midSlider" min="-12" max="12" value="0" step="1">
          <span class="eq-val" id="midVal">0dB</span>
        </div>

        <div class="eq-slider-row">
          <span class="eq-name">Treble</span>
          <input type="range" id="trebleSlider" min="-12" max="12" value="0" step="1">
          <span class="eq-val" id="trebleVal">0dB</span>
        </div>
      </div>

      <!-- Touch Bottom Actions -->
      <div class="touch-softkeys">
        <button class="touch-action-btn" onclick="document.getElementById('audioInput').click()">📂 Open Audio</button>
      </div>
    </div>

    <input type="file" id="audioInput" accept=".mp3,.m4a,.wav,.aac,.ogg,audio/*,audio/mpeg,audio/mp4" multiple>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const audio = document.getElementById('audioElement');
    const audioInput = document.getElementById('audioInput');
    const marqueeWrapper = document.getElementById('marqueeWrapper');
    const trackName = document.getElementById('trackName');
    const trackIndex = document.getElementById('trackIndex');

    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const totalDurationEl = document.getElementById('totalDuration');

    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const stopBtn = document.getElementById('stopBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    const volSlider = document.getElementById('volSlider');
    const volIcon = document.getElementById('volIcon');
    const volText = document.getElementById('volText');

    const bassSlider = document.getElementById('bassSlider');
    const midSlider = document.getElementById('midSlider');
    const trebleSlider = document.getElementById('trebleSlider');
    const bassVal = document.getElementById('bassVal');
    const midVal = document.getElementById('midVal');
    const trebleVal = document.getElementById('trebleVal');

    let playlist = [];
    let currentIndex = 0;
    let lastVolume = 1;
    let isSeeking = false;

    let audioCtx = null;
    let sourceNode = null;
    let bassFilter = null;
    let midFilter = null;
    let trebleFilter = null;
    let gainNode = null;

    function updateTrackTitle(title) {
      trackName.classList.remove('marquee-active');
      trackName.textContent = title;

      setTimeout(() => {
        const wrapperWidth = marqueeWrapper.offsetWidth;
        const textWidth = trackName.scrollWidth;

        if (textWidth > wrapperWidth) {
          trackName.innerHTML = `<span>${title}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span><span>${title}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`;
          const duration = Math.max(8, Math.round(textWidth / 25));
          trackName.style.animationDuration = `${duration}s`;
          trackName.classList.add('marquee-active');
        } else {
          trackName.textContent = title;
        }
      }, 50);
    }

    function setupEqualizer() {
      if (audioCtx) return;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
      sourceNode = audioCtx.createMediaElementSource(audio);

      bassFilter = audioCtx.createBiquadFilter();
      bassFilter.type = 'lowshelf';
      bassFilter.frequency.value = 60;
      bassFilter.gain.value = Number(bassSlider.value);

      midFilter = audioCtx.createBiquadFilter();
      midFilter.type = 'peaking';
      midFilter.frequency.value = 1000;
      midFilter.Q.value = 1.0;
      midFilter.gain.value = Number(midSlider.value);

      trebleFilter = audioCtx.createBiquadFilter();
      trebleFilter.type = 'highshelf';
      trebleFilter.frequency.value = 3000;
      trebleFilter.gain.value = Number(trebleSlider.value);

      gainNode = audioCtx.createGain();
      gainNode.gain.value = Number(volSlider.value);

      sourceNode.connect(bassFilter);
      bassFilter.connect(midFilter);
      midFilter.connect(trebleFilter);
      trebleFilter.connect(gainNode);
      gainNode.connect(audioCtx.destination);
    }

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return "00:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function setPlayButtonIcon(isPlaying) {
      if (isPlaying) {
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    }

    function playAudio() {
      setupEqualizer();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      audio.play().then(() => {
        setPlayButtonIcon(true);
      }).catch(() => {});
    }

    function pauseAudio() {
      audio.pause();
      setPlayButtonIcon(false);
    }

    function seekToPosition(clientX) {
      if (!audio.src || isNaN(audio.duration) || audio.duration <= 0) return;
      const rect = progressContainer.getBoundingClientRect();
      const clickX = clientX - rect.left;
      const clampedX = Math.max(0, Math.min(rect.width, clickX));
      const percentage = clampedX / rect.width;

      const targetTime = percentage * audio.duration;
      audio.currentTime = targetTime;
      progressFill.style.width = `${percentage * 100}%`;
      currentTimeEl.textContent = formatTime(targetTime);

      if (audio.paused) {
        playAudio();
      }
    }

    progressContainer.addEventListener('pointerdown', (e) => {
      isSeeking = true;
      seekToPosition(e.clientX);
    });

    window.addEventListener('pointermove', (e) => {
      if (isSeeking) {
        seekToPosition(e.clientX);
      }
    });

    window.addEventListener('pointerup', () => {
      isSeeking = false;
    });

    window.addEventListener('pointercancel', () => {
      isSeeking = false;
    });

    // Chat link receiver
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const streamUrl = params.get('stream');
      const songTitle = params.get('title');
      const artist = params.get('artist');

      if (streamUrl) {
        const fullTitle = songTitle ? decodeURIComponent(songTitle) : "Telegram Audio";
        updateTrackTitle(fullTitle);
        trackIndex.textContent = artist ? `Chat Stream • ${decodeURIComponent(artist)}` : "Streaming Track";
        audio.src = streamUrl;
        audio.load();
        playAudio();
      }
    });

    // File Picker
    audioInput.addEventListener('change', function() {
      if (this.files.length > 0) {
        playlist = Array.from(this.files);
        currentIndex = 0;
        const file = playlist[0];
        updateTrackTitle(file.name);
        trackIndex.textContent = `Memory Card • [1/${playlist.length}]`;
        audio.src = URL.createObjectURL(file);
        audio.load();
        playAudio();
      }
    });

    playPauseBtn.addEventListener('click', () => {
      if (!audio.src) return;
      if (audio.paused) playAudio();
      else pauseAudio();
    });

    stopBtn.addEventListener('click', () => {
      if (!audio.src) return;
      audio.pause();
      audio.currentTime = 0;
      setPlayButtonIcon(false);
      progressFill.style.width = '0%';
      currentTimeEl.textContent = "00:00";
    });

    nextBtn.addEventListener('click', () => {
      if (playlist.length <= 1) return;
      currentIndex = (currentIndex + 1) % playlist.length;
      const file = playlist[currentIndex];
      updateTrackTitle(file.name);
      trackIndex.textContent = `Memory Card • [${currentIndex + 1}/${playlist.length}]`;
      audio.src = URL.createObjectURL(file);
      audio.load();
      playAudio();
    });

    prevBtn.addEventListener('click', () => {
      if (playlist.length <= 1) return;
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      const file = playlist[currentIndex];
      updateTrackTitle(file.name);
      trackIndex.textContent = `Memory Card • [${currentIndex + 1}/${playlist.length}]`;
      audio.src = URL.createObjectURL(file);
      audio.load();
      playAudio();
    });

    audio.addEventListener('timeupdate', () => {
      if (!isSeeking && !isNaN(audio.duration) && audio.duration > 0) {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${percent}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      totalDurationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      if (playlist.length > 1) {
        currentIndex = (currentIndex + 1) % playlist.length;
        const file = playlist[currentIndex];
        updateTrackTitle(file.name);
        trackIndex.textContent = `Memory Card • [${currentIndex + 1}/${playlist.length}]`;
        audio.src = URL.createObjectURL(file);
        audio.load();
        playAudio();
      } else {
        setPlayButtonIcon(false);
      }
    });

    // Volume
    function updateVolume(val) {
      val = Math.max(0, Math.min(1, val));
      audio.volume = val;
      if (gainNode) gainNode.gain.value = val;
      volSlider.value = val;
      volText.textContent = `${Math.round(val * 100)}%`;
      volIcon.textContent = val === 0 ? '🔇' : (val < 0.5 ? '🔉' : '🔊');
    }

    volSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (val > 0) lastVolume = val;
      updateVolume(val);
    });

    volIcon.addEventListener('click', () => {
      if (audio.volume > 0) {
        lastVolume = audio.volume;
        updateVolume(0);
      } else {
        updateVolume(lastVolume > 0 ? lastVolume : 1);
      }
    });

    // Equalizer Sliders
    bassSlider.addEventListener('input', (e) => {
      bassVal.textContent = `${e.target.value}dB`;
      if (bassFilter) bassFilter.gain.value = Number(e.target.value);
    });

    midSlider.addEventListener('input', (e) => {
      midVal.textContent = `${e.target.value}dB`;
      if (midFilter) midFilter.gain.value = Number(e.target.value);
    });

    trebleSlider.addEventListener('input', (e) => {
      trebleVal.textContent = `${e.target.value}dB`;
      if (trebleFilter) trebleFilter.gain.value = Number(e.target.value);
    });
  </script>
</body>
</html>
