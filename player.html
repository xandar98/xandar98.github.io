<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TubeTV Neon Equalizer Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --accent: #8b5cf6;
      --card-bg: rgba(22, 27, 46, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --surface: rgba(255, 255, 255, 0.04);
      --text: #f8fafc;
      --subtext: #94a3b8;
      --slider-track: rgba(255, 255, 255, 0.12);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      background: radial-gradient(circle at 10% 20%, #1e1145 0%, #0b0f19 55%, #05070d 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .player-card {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 40px rgba(99, 102, 241, 0.12);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      text-align: center;
    }
    .header h2 {
      margin: 0 0 4px 0;
      font-size: 1.25rem;
      letter-spacing: 0.5px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 40%, #c4b5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      background: rgba(139, 92, 246, 0.15);
      color: #c4b5fd;
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 3px 10px;
      border-radius: 20px;
      display: inline-block;
    }
    .file-btn {
      width: 100%;
      padding: 12px;
      background: var(--surface);
      border: 1px dashed rgba(168, 85, 247, 0.4);
      color: #e2e8f0;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .file-btn:active {
      transform: scale(0.98);
      background: rgba(168, 85, 247, 0.1);
    }
    #audioInput {
      display: none;
    }

    /* Track Information with Sliding Animation */
    .track-info {
      text-align: center;
      padding: 2px 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .marquee-wrapper {
      width: 100%;
      overflow: hidden;
      position: relative;
      white-space: nowrap;
      display: flex;
      justify-content: center;
    }
    .track-title {
      display: inline-block;
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      will-change: transform;
    }
    /* Auto sliding animation when text overflows */
    .marquee-active {
      display: inline-flex;
      animation: marqueeSlide 10s linear infinite;
    }
    .marquee-active:hover {
      animation-play-state: paused;
    }
    @keyframes marqueeSlide {
      0% {
        transform: translateX(0%);
      }
      100% {
        transform: translateX(-50%);
      }
    }

    .track-status {
      font-size: 0.78rem;
      color: var(--subtext);
      margin-top: 4px;
    }

    /* Progress & Timing Bar */
    .progress-area {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--slider-track);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary-gradient);
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
      pointer-events: none;
    }
    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--subtext);
      font-variant-numeric: tabular-nums;
    }

    /* Modern Vector Action Buttons */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 4px 0;
    }
    .btn-ctrl {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-ctrl svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    .btn-ctrl:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.12);
    }
    .btn-play {
      width: 60px;
      height: 60px;
      background: var(--primary-gradient);
      border: none;
      color: #fff;
      box-shadow: 0 8px 24px rgba(139, 92, 246, 0.45);
    }
    .btn-play svg {
      width: 24px;
      height: 24px;
      fill: #ffffff;
    }
    .btn-play:active {
      transform: scale(0.92);
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }

    /* Volume Slider */
    .volume-box {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .vol-icon {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--subtext);
      transition: color 0.2s;
    }
    .vol-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .vol-icon:hover {
      color: #fff;
    }
    .vol-percent {
      font-size: 0.75rem;
      color: var(--subtext);
      min-width: 36px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* Equalizer Box */
    .eq-container {
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .eq-header {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .eq-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .eq-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--subtext);
    }
    .eq-label b {
      color: #e2e8f0;
    }
    input[type="range"] {
      flex: 1;
      width: 100%;
      height: 5px;
      background: var(--slider-track);
      border-radius: 3px;
      outline: none;
      accent-color: var(--accent);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="header">
      <h2>TubeTV Equalizer</h2>
      <span class="badge">Chat & Local Audio</span>
    </div>

    <!-- Local File Picker -->
    <button type="button" class="file-btn" onclick="document.getElementById('audioInput').click()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path>
      </svg>
      <span id="fileBtnText">Choose Local Audio</span>
    </button>
    <input type="file" id="audioInput" accept=".mp3,.m4a,.wav,.aac,.ogg,audio/*,audio/mpeg,audio/mp4" multiple>

    <!-- Track Details (With Sliding Support) -->
    <div class="track-info">
      <div class="marquee-wrapper" id="marqueeWrapper">
        <span class="track-title" id="trackName">Waiting for audio...</span>
      </div>
      <div class="track-status" id="trackIndex">Select file or launch from chat</div>
    </div>

    <audio id="audioElement" playsinline crossorigin="anonymous"></audio>

    <!-- Progress Bar -->
    <div class="progress-area">
      <div class="progress-bar-container" id="progressContainer">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-labels">
        <span id="currentTime">00:00</span>
        <span id="totalDuration">00:00</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="controls">
      <!-- Previous -->
      <button class="btn-ctrl" id="prevBtn" title="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>

      <!-- Stop -->
      <button class="btn-ctrl" id="stopBtn" title="Stop">
        <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
      </button>

      <!-- Play/Pause -->
      <button class="btn-ctrl btn-play" id="playPauseBtn" title="Play">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <!-- Next -->
      <button class="btn-ctrl" id="nextBtn" title="Next">
        <svg viewBox="0 0 24 24"><path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <!-- Volume Control -->
    <div class="volume-box">
      <div class="vol-icon" id="volIcon">
        <svg id="volSvg" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </div>
      <input type="range" id="volSlider" min="0" max="1" step="0.01" value="1">
      <span class="vol-percent" id="volText">100%</span>
    </div>

    <!-- 3-Band Equalizer -->
    <div class="eq-container">
      <div class="eq-header">
        <span>🎛️ Equalizer</span>
        <span style="font-size:0.72rem; color:var(--subtext)">Real-time DSP</span>
      </div>

      <div class="eq-group">
        <div class="eq-label">
          <span>Bass (60 Hz)</span>
          <b id="bassVal">0 dB</b>
        </div>
        <input type="range" id="bassSlider" min="-12" max="12" value="0" step="1">
      </div>

      <div class="eq-group">
        <div class="eq-label">
          <span>Mid (1 kHz)</span>
          <b id="midVal">0 dB</b>
        </div>
        <input type="range" id="midSlider" min="-12" max="12" value="0" step="1">
      </div>

      <div class="eq-group">
        <div class="eq-label">
          <span>Treble (3 kHz)</span>
          <b id="trebleVal">0 dB</b>
        </div>
        <input type="range" id="trebleSlider" min="-12" max="12" value="0" step="1">
      </div>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const audio = document.getElementById('audioElement');
    const audioInput = document.getElementById('audioInput');
    const marqueeWrapper = document.getElementById('marqueeWrapper');
    const trackName = document.getElementById('trackName');
    const trackIndex = document.getElementById('trackIndex');
    const fileBtnText = document.getElementById('fileBtnText');

    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const totalDurationEl = document.getElementById('totalDuration');

    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const stopBtn = document.getElementById('stopBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    const volSlider = document.getElementById('volSlider');
    const volIcon = document.getElementById('volIcon');
    const volSvg = document.getElementById('volSvg');
    const volText = document.getElementById('volText');

    const bassSlider = document.getElementById('bassSlider');
    const midSlider = document.getElementById('midSlider');
    const trebleSlider = document.getElementById('trebleSlider');
    const bassVal = document.getElementById('bassVal');
    const midVal = document.getElementById('midVal');
    const trebleVal = document.getElementById('trebleVal');

    let playlist = [];
    let currentIndex = 0;
    let lastVolume = 1;

    let audioCtx = null;
    let sourceNode = null;
    let bassFilter = null;
    let midFilter = null;
    let trebleFilter = null;
    let gainNode = null;

    // গানের নাম বড় হলে ডাইনামিক স্লাইড এনিমেশন হ্যান্ডলার
    function updateTrackTitle(title) {
      // রিসেট
      trackName.classList.remove('marquee-active');
      trackName.style.animationDuration = '10s';
      trackName.textContent = title;

      // মেপে দেখা নাম কন্টেইনারের চেয়ে বড় কি না
      setTimeout(() => {
        const wrapperWidth = marqueeWrapper.offsetWidth;
        const textWidth = trackName.scrollWidth;

        if (textWidth > wrapperWidth) {
          // নাম দ্বিগুণ করে দেওয়া যাতে লুপে স্মুথ ট্রানজিশন হয়
          trackName.innerHTML = `<span>${title}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span><span>${title}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`;
          
          // টাইটেল যত বড় হবে স্পিড সেভাবে ব্যালেন্স হবে
          const duration = Math.max(8, Math.round(textWidth / 25));
          trackName.style.animationDuration = `${duration}s`;
          trackName.classList.add('marquee-active');
        } else {
          trackName.textContent = title;
        }
      }, 50);
    }

    function setupEqualizer() {
      if (audioCtx) return;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
      sourceNode = audioCtx.createMediaElementSource(audio);

      bassFilter = audioCtx.createBiquadFilter();
      bassFilter.type = 'lowshelf';
      bassFilter.frequency.value = 60;
      bassFilter.gain.value = Number(bassSlider.value);

      midFilter = audioCtx.createBiquadFilter();
      midFilter.type = 'peaking';
      midFilter.frequency.value = 1000;
      midFilter.Q.value = 1.0;
      midFilter.gain.value = Number(midSlider.value);

      trebleFilter = audioCtx.createBiquadFilter();
      trebleFilter.type = 'highshelf';
      trebleFilter.frequency.value = 3000;
      trebleFilter.gain.value = Number(trebleSlider.value);

      gainNode = audioCtx.createGain();
      gainNode.gain.value = Number(volSlider.value);

      sourceNode.connect(bassFilter);
      bassFilter.connect(midFilter);
      midFilter.connect(trebleFilter);
      trebleFilter.connect(gainNode);
      gainNode.connect(audioCtx.destination);
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function setPlayButtonIcon(isPlaying) {
      if (isPlaying) {
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    }

    function playAudio() {
      setupEqualizer();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      audio.play().then(() => {
        setPlayButtonIcon(true);
      }).catch(() => {});
    }

    function pauseAudio() {
      audio.pause();
      setPlayButtonIcon(false);
    }

    // চ্যাট থেকে অডিও লিঙ্ক আসা হ্যান্ডল করা
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const streamUrl = params.get('stream');
      const songTitle = params.get('title');
      const artist = params.get('artist');

      if (streamUrl) {
        const fullTitle = songTitle ? decodeURIComponent(songTitle) : "Telegram Audio";
        updateTrackTitle(fullTitle);
        trackIndex.textContent = artist ? `From Chat • ${decodeURIComponent(artist)}` : "Playing from Telegram Chat";
        audio.src = streamUrl;
        audio.load();
        playAudio();
      }
    });

    // লোকাল ফাইল পিকার
    audioInput.addEventListener('change', function() {
      if (this.files.length > 0) {
        playlist = Array.from(this.files);
        fileBtnText.textContent = `Loaded ${playlist.length} song(s)`;
        currentIndex = 0;
        const file = playlist[0];
        updateTrackTitle(file.name);
        trackIndex.textContent = `Track 1 of ${playlist.length} (Local)`;
        audio.src = URL.createObjectURL(file);
        audio.load();
        playAudio();
      }
    });

    playPauseBtn.addEventListener('click', () => {
      if (!audio.src) return;
      if (audio.paused) playAudio();
      else pauseAudio();
    });

    stopBtn.addEventListener('click', () => {
      if (!audio.src) return;
      audio.pause();
      audio.currentTime = 0;
      setPlayButtonIcon(false);
      progressFill.style.width = '0%';
      currentTimeEl.textContent = "00:00";
    });

    nextBtn.addEventListener('click', () => {
      if (playlist.length <= 1) return;
      currentIndex = (currentIndex + 1) % playlist.length;
      const file = playlist[currentIndex];
      updateTrackTitle(file.name);
      trackIndex.textContent = `Track ${currentIndex + 1} of ${playlist.length}`;
      audio.src = URL.createObjectURL(file);
      audio.load();
      playAudio();
    });

    prevBtn.addEventListener('click', () => {
      if (playlist.length <= 1) return;
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      const file = playlist[currentIndex];
      updateTrackTitle(file.name);
      trackIndex.textContent = `Track ${currentIndex + 1} of ${playlist.length}`;
      audio.src = URL.createObjectURL(file);
      audio.load();
      playAudio();
    });

    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${percent}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      totalDurationEl.textContent = formatTime(audio.duration);
    });

    progressContainer.addEventListener('click', (e) => {
      if (!audio.src || isNaN(audio.duration)) return;
      const rect = progressContainer.getBoundingClientRect();
      const clickPos = (e.clientX - rect.left) / rect.width;
      audio.currentTime = clickPos * audio.duration;
    });

    // ভলিউম আপডেট
    function updateVolume(val) {
      val = Math.max(0, Math.min(1, val));
      audio.volume = val;
      if (gainNode) gainNode.gain.value = val;
      volSlider.value = val;
      volText.textContent = `${Math.round(val * 100)}%`;

      if (val === 0) {
        volSvg.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/>';
      } else if (val < 0.5) {
        volSvg.innerHTML = '<path d="M7 9v6h4l5 5V4L11 9H7zm11.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>';
      } else {
        volSvg.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
      }
    }

    volSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (val > 0) lastVolume = val;
      updateVolume(val);
    });

    volIcon.addEventListener('click', () => {
      if (audio.volume > 0) {
        lastVolume = audio.volume;
        updateVolume(0);
      } else {
        updateVolume(lastVolume > 0 ? lastVolume : 1);
      }
    });

    // EQ Sliders
    bassSlider.addEventListener('input', (e) => {
      bassVal.textContent = `${e.target.value} dB`;
      if (bassFilter) bassFilter.gain.value = Number(e.target.value);
    });

    midSlider.addEventListener('input', (e) => {
      midVal.textContent = `${e.target.value} dB`;
      if (midFilter) midFilter.gain.value = Number(e.target.value);
    });

    trebleSlider.addEventListener('input', (e) => {
      trebleVal.textContent = `${e.target.value} dB`;
      if (trebleFilter) trebleFilter.gain.value = Number(e.target.value);
    });
  </script>
</body>
</html>
