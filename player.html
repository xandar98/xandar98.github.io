<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Symbian S60 Music Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --s60-body-bg: #1c2024;
      --s60-frame: #323842;
      --s60-screen-bg: #0c1219;
      --s60-header: #1b2838;
      --s60-blue: #0084ff;
      --s60-orange: #ff7700;
      --s60-text: #e6f0fa;
      --s60-subtext: #7d93a8;
      --s60-key: #252b35;
      --s60-key-border: #444d5c;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 12px;
      min-height: 100vh;
      background: #080a0d;
      color: var(--s60-text);
      font-family: "Tahoma", "Lucida Grande", "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Classic Nokia Chasis Frame */
    .nokia-device {
      width: 100%;
      max-width: 370px;
      background: linear-gradient(180deg, #3d4552 0%, #20242c 100%);
      border: 3px solid #566173;
      border-radius: 26px;
      padding: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.9), inset 0 2px 4px rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Metallic Earpiece Grill & Brand */
    .brand-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
    }
    .brand-title {
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: #9eb1c7;
      text-transform: uppercase;
    }
    .earpiece {
      width: 48px;
      height: 4px;
      background: #111418;
      border-radius: 4px;
      box-shadow: inset 0 1px 1px #000, 0 1px 1px rgba(255, 255, 255, 0.15);
    }
    .s60-tag {
      font-size: 0.65rem;
      color: var(--s60-blue);
      font-weight: 700;
    }

    /* Symbian TFT LCD Display Screen */
    .symbian-screen {
      background: var(--s60-screen-bg);
      border: 2px solid #000;
      border-radius: 12px;
      padding: 12px;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8), 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    /* Screen Top Status Bar (Battery, Signal, Mode) */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      color: var(--s60-blue);
      border-bottom: 1px solid #1a2533;
      padding-bottom: 4px;
    }

    /* Marquee / Title area */
    .track-view {
      background: #080d14;
      border: 1px solid #1c2b3d;
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }
    .marquee-wrapper {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      display: flex;
      justify-content: center;
    }
    .track-title {
      display: inline-block;
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }
    .marquee-active {
      display: inline-flex;
      animation: marqueeSlide 10s linear infinite;
    }
    @keyframes marqueeSlide {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .track-meta {
      font-size: 0.7rem;
      color: var(--s60-orange);
      margin-top: 2px;
    }

    /* Symbian Progress Bar */
    .progress-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .progress-bar-container {
      width: 100%;
      height: 18px;
      display: flex;
      align-items: center;
      cursor: pointer;
      touch-action: none;
    }
    .progress-track {
      width: 100%;
      height: 8px;
      background: #151d27;
      border: 1px solid #28374a;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #005bb5, #0099ff);
      pointer-events: none;
    }
    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: var(--s60-subtext);
      font-family: monospace;
    }

    /* Retro 3-Band Equalizer LCD Box */
    .eq-screen-box {
      background: #070b10;
      border: 1px solid #162230;
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .eq-screen-title {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--s60-blue);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .eq-slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .eq-name {
      font-size: 0.65rem;
      color: var(--s60-subtext);
      width: 44px;
    }
    .eq-val {
      font-size: 0.65rem;
      color: var(--s60-orange);
      width: 32px;
      text-align: right;
      font-family: monospace;
    }
    input[type="range"] {
      flex: 1;
      height: 4px;
      background: #1b2636;
      border-radius: 2px;
      outline: none;
      accent-color: var(--s60-blue);
      cursor: pointer;
    }

    /* Softkeys & Action Area */
    .softkeys-row {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #172230;
      padding-top: 6px;
    }
    .softkey-btn {
      background: transparent;
      border: none;
      color: var(--s60-blue);
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      padding: 2px 4px;
    }
    .softkey-btn:active {
      color: var(--s60-orange);
    }
    #audioInput {
      display: none;
    }

    /* Hardware Buttons & D-Pad Section */
    .keypad-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    .controls-grid {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }
    .hw-key {
      background: linear-gradient(180deg, #3a4250 0%, #1e242d 100%);
      border: 1px solid var(--s60-key-border);
      color: #cfd8dc;
      border-radius: 12px;
      width: 46px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 0 #12161c, inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    .hw-key svg {
      width: 16px;
      height: 16px;
      fill: #cfd8dc;
    }
    .hw-key:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #12161c;
      background: #1e242d;
    }

    /* Center Media Play Key */
    .hw-play-key {
      width: 58px;
      height: 44px;
      background: linear-gradient(180deg, #2b6cb0 0%, #1a365d 100%);
      border: 1px solid #4299e1;
      border-radius: 14px;
      box-shadow: 0 3px 0 #0d1b2a, inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }
    .hw-play-key svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    /* Volume Row inside Hardware bezel */
    .vol-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .vol-icon {
      font-size: 0.75rem;
      color: var(--s60-subtext);
      cursor: pointer;
    }
    .vol-text {
      font-size: 0.68rem;
      font-family: monospace;
      color: var(--s60-text);
      width: 32px;
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="nokia-device">
    <!-- Top Grill & Nokia Styling -->
    <div class="brand-bar">
      <span class="brand-title">NOKIA</span>
      <div class="earpiece"></div>
      <span class="s60-tag">Nseries</span>
    </div>

    <!-- Symbian Color Screen -->
    <div class="symbian-screen">
      <!-- Status Top -->
      <div class="status-bar">
        <span>📶 3G</span>
        <span>MUSIC PLAYER</span>
        <span id="screenBattery">🔋 100%</span>
      </div>

      <!-- Track Details Screen -->
      <div class="track-view">
        <div class="marquee-wrapper" id="marqueeWrapper">
          <span class="track-title" id="trackName">Standby mode</span>
        </div>
        <div class="track-meta" id="trackIndex">Select file or chat link</div>
      </div>

      <audio id="audioElement" playsinline crossorigin="anonymous"></audio>

      <!-- Timing / Progress Bar -->
      <div class="progress-box">
        <div class="progress-bar-container" id="progressContainer">
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
        <div class="time-labels">
          <span id="currentTime">00:00</span>
          <span id="totalDuration">00:00</span>
        </div>
      </div>

      <!-- Built-in 3-Band Equalizer Box -->
      <div class="eq-screen-box">
        <div class="eq-screen-title">
          <span>Preset: Manual EQ</span>
          <span>S60 DSP</span>
        </div>

        <div class="eq-slider-row">
          <span class="eq-name">Bass</span>
          <input type="range" id="bassSlider" min="-12" max="12" value="0" step="1">
          <span class="eq-val" id="bassVal">0dB</span>
        </div>

        <div class="eq-slider-row">
          <span class="eq-name">Mid</span>
          <input type="range" id="midSlider" min="-12" max="12" value="0" step="1">
          <span class="eq-val" id="midVal">0dB</span>
        </div>

        <div class="eq-slider-row">
          <span class="eq-name">Treble</span>
          <input type="range" id="trebleSlider" min="-12" max="12" value="0" step="1">
          <span class="eq-val" id="trebleVal">0dB</span>
        </div>
      </div>

      <!-- Symbian Softkeys -->
      <div class="softkeys-row">
        <button class="softkey-btn" onclick="document.getElementById('audioInput').click()">📁 Open File</button>
        <button class="softkey-btn" id="stopSoftkey">⏹ Stop</button>
      </div>
    </div>

    <input type="file" id="audioInput" accept=".mp3,.m4a,.wav,.aac,.ogg,audio/*,audio/mpeg,audio/mp4" multiple>

    <!-- Retro Hardware Keypad Area -->
    <div class="keypad-panel">
      <!-- Media Navigation Controls -->
      <div class="controls-grid">
        <button class="hw-key" id="prevBtn" title="Rewind">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>

        <button class="hw-key hw-play-key" id="playPauseBtn" title="Play / Pause">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button class="hw-key" id="nextBtn" title="Forward">
          <svg viewBox="0 0 24 24"><path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

      <!-- Volume Adjuster Bar -->
      <div class="vol-row">
        <span class="vol-icon" id="volIcon">🔊</span>
        <input type="range" id="volSlider" min="0" max="1" step="0.01" value="1">
        <span class="vol-text" id="volText">100%</span>
      </div>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const audio = document.getElementById('audioElement');
    const audioInput = document.getElementById('audioInput');
    const marqueeWrapper = document.getElementById('marqueeWrapper');
    const trackName = document.getElementById('trackName');
    const trackIndex = document.getElementById('trackIndex');

    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const totalDurationEl = document.getElementById('totalDuration');

    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const stopSoftkey = document.getElementById('stopSoftkey');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    const volSlider = document.getElementById('volSlider');
    const volIcon = document.getElementById('volIcon');
    const volText = document.getElementById('volText');

    const bassSlider = document.getElementById('bassSlider');
    const midSlider = document.getElementById('midSlider');
    const trebleSlider = document.getElementById('trebleSlider');
    const bassVal = document.getElementById('bassVal');
    const midVal = document.getElementById('midVal');
    const trebleVal = document.getElementById('trebleVal');

    let playlist = [];
    let currentIndex = 0;
    let lastVolume = 1;
    let isSeeking = false;

    let audioCtx = null;
    let sourceNode = null;
    let bassFilter = null;
    let midFilter = null;
    let trebleFilter = null;
    let gainNode = null;

    function updateTrackTitle(title) {
      trackName.classList.remove('marquee-active');
      trackName.textContent = title;

      setTimeout(() => {
        const wrapperWidth = marqueeWrapper.offsetWidth;
        const textWidth = trackName.scrollWidth;

        if (textWidth > wrapperWidth) {
          trackName.innerHTML = `<span>${title}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span><span>${title}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`;
          const duration = Math.max(8, Math.round(textWidth / 25));
          trackName.style.animationDuration = `${duration}s`;
          trackName.classList.add('marquee-active');
        } else {
          trackName.textContent = title;
        }
      }, 50);
    }

    function setupEqualizer() {
      if (audioCtx) return;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
      sourceNode = audioCtx.createMediaElementSource(audio);

      bassFilter = audioCtx.createBiquadFilter();
      bassFilter.type = 'lowshelf';
      bassFilter.frequency.value = 60;
      bassFilter.gain.value = Number(bassSlider.value);

      midFilter = audioCtx.createBiquadFilter();
      midFilter.type = 'peaking';
      midFilter.frequency.value = 1000;
      midFilter.Q.value = 1.0;
      midFilter.gain.value = Number(midSlider.value);

      trebleFilter = audioCtx.createBiquadFilter();
      trebleFilter.type = 'highshelf';
      trebleFilter.frequency.value = 3000;
      trebleFilter.gain.value = Number(trebleSlider.value);

      gainNode = audioCtx.createGain();
      gainNode.gain.value = Number(volSlider.value);

      sourceNode.connect(bassFilter);
      bassFilter.connect(midFilter);
      midFilter.connect(trebleFilter);
      trebleFilter.connect(gainNode);
      gainNode.connect(audioCtx.destination);
    }

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return "00:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function setPlayButtonIcon(isPlaying) {
      if (isPlaying) {
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    }

    function playAudio() {
      setupEqualizer();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      audio.play().then(() => {
        setPlayButtonIcon(true);
      }).catch(() => {});
    }

    function pauseAudio() {
      audio.pause();
      setPlayButtonIcon(false);
    }

    function seekToPosition(clientX) {
      if (!audio.src || isNaN(audio.duration) || audio.duration <= 0) return;
      const rect = progressContainer.getBoundingClientRect();
      const clickX = clientX - rect.left;
      const clampedX = Math.max(0, Math.min(rect.width, clickX));
      const percentage = clampedX / rect.width;

      const targetTime = percentage * audio.duration;
      audio.currentTime = targetTime;
      progressFill.style.width = `${percentage * 100}%`;
      currentTimeEl.textContent = formatTime(targetTime);

      if (audio.paused) {
        playAudio();
      }
    }

    progressContainer.addEventListener('pointerdown', (e) => {
      isSeeking = true;
      seekToPosition(e.clientX);
    });

    window.addEventListener('pointermove', (e) => {
      if (isSeeking) {
        seekToPosition(e.clientX);
      }
    });

    window.addEventListener('pointerup', () => {
      isSeeking = false;
    });

    // Chat link receiver
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const streamUrl = params.get('stream');
      const songTitle = params.get('title');
      const artist = params.get('artist');

      if (streamUrl) {
        const fullTitle = songTitle ? decodeURIComponent(songTitle) : "Telegram Audio";
        updateTrackTitle(fullTitle);
        trackIndex.textContent = artist ? `Chat • ${decodeURIComponent(artist)}` : "Streaming Track";
        audio.src = streamUrl;
        audio.load();
        playAudio();
      }
    });

    // File Picker
    audioInput.addEventListener('change', function() {
      if (this.files.length > 0) {
        playlist = Array.from(this.files);
        currentIndex = 0;
        const file = playlist[0];
        updateTrackTitle(file.name);
        trackIndex.textContent = `Memory Card • [1/${playlist.length}]`;
        audio.src = URL.createObjectURL(file);
        audio.load();
        playAudio();
      }
    });

    playPauseBtn.addEventListener('click', () => {
      if (!audio.src) return;
      if (audio.paused) playAudio();
      else pauseAudio();
    });

    stopSoftkey.addEventListener('click', () => {
      if (!audio.src) return;
      audio.pause();
      audio.currentTime = 0;
      setPlayButtonIcon(false);
      progressFill.style.width = '0%';
      currentTimeEl.textContent = "00:00";
    });

    nextBtn.addEventListener('click', () => {
      if (playlist.length <= 1) return;
      currentIndex = (currentIndex + 1) % playlist.length;
      const file = playlist[currentIndex];
      updateTrackTitle(file.name);
      trackIndex.textContent = `Memory Card • [${currentIndex + 1}/${playlist.length}]`;
      audio.src = URL.createObjectURL(file);
      audio.load();
      playAudio();
    });

    prevBtn.addEventListener('click', () => {
      if (playlist.length <= 1) return;
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      const file = playlist[currentIndex];
      updateTrackTitle(file.name);
      trackIndex.textContent = `Memory Card • [${currentIndex + 1}/${playlist.length}]`;
      audio.src = URL.createObjectURL(file);
      audio.load();
      playAudio();
    });

    audio.addEventListener('timeupdate', () => {
      if (!isSeeking && !isNaN(audio.duration) && audio.duration > 0) {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${percent}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      totalDurationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      if (playlist.length > 1) {
        currentIndex = (currentIndex + 1) % playlist.length;
        const file = playlist[currentIndex];
        updateTrackTitle(file.name);
        trackIndex.textContent = `Memory Card • [${currentIndex + 1}/${playlist.length}]`;
        audio.src = URL.createObjectURL(file);
        audio.load();
        playAudio();
      } else {
        setPlayButtonIcon(false);
      }
    });

    // Volume
    function updateVolume(val) {
      val = Math.max(0, Math.min(1, val));
      audio.volume = val;
      if (gainNode) gainNode.gain.value = val;
      volSlider.value = val;
      volText.textContent = `${Math.round(val * 100)}%`;
      volIcon.textContent = val === 0 ? '🔇' : (val < 0.5 ? '🔉' : '🔊');
    }

    volSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (val > 0) lastVolume = val;
      updateVolume(val);
    });

    volIcon.addEventListener('click', () => {
      if (audio.volume > 0) {
        lastVolume = audio.volume;
        updateVolume(0);
      } else {
        updateVolume(lastVolume > 0 ? lastVolume : 1);
      }
    });

    // Equalizer
    bassSlider.addEventListener('input', (e) => {
      bassVal.textContent = `${e.target.value}dB`;
      if (bassFilter) bassFilter.gain.value = Number(e.target.value);
    });

    midSlider.addEventListener('input', (e) => {
      midVal.textContent = `${e.target.value}dB`;
      if (midFilter) midFilter.gain.value = Number(e.target.value);
    });

    trebleSlider.addEventListener('input', (e) => {
      trebleVal.textContent = `${e.target.value}dB`;
      if (trebleFilter) trebleFilter.gain.value = Number(e.target.value);
    });
  </script>
</body>
</html>
