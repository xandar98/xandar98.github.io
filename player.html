<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Offline Equalizer Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0d0f14;
      --card: #181b24;
      --accent: #4e73df;
      --text: #ffffff;
      --subtext: #8e95a5;
      --slider-bg: #2a2e3d;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .player-card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      text-align: center;
    }
    .header h2 {
      margin: 0 0 4px 0;
      font-size: 1.2rem;
    }
    .badge {
      font-size: 0.75rem;
      background: #1c2b4d;
      color: #6c9bff;
      padding: 3px 8px;
      border-radius: 12px;
      display: inline-block;
    }
    /* iOS friendly file picker button */
    .file-btn {
      width: 100%;
      padding: 12px;
      background: #242a3a;
      border: 1px dashed #4e73df;
      color: #fff;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    #audioInput {
      display: none;
    }
    .track-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
      color: #4e73df;
    }
    audio {
      width: 100%;
      height: 40px;
      border-radius: 8px;
    }
    .eq-container {
      background: #12141c;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .eq-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .eq-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--subtext);
    }
    .eq-label b {
      color: var(--text);
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      background: var(--slider-bg);
      border-radius: 3px;
      outline: none;
      accent-color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="header">
      <h2>Offline Equalizer Player</h2>
      <span class="badge">iOS & Offline Ready</span>
    </div>

    <!-- Clickable Button for iOS Files Picker -->
    <button type="button" class="file-btn" onclick="document.getElementById('audioInput').click()">
      📁 <span id="fileBtnText">Choose MP3 / Audio File</span>
    </button>

    <!-- iOS Fix: Added extensions and common audio MIME types -->
    <input type="file" id="audioInput" accept=".mp3,.m4a,.wav,.aac,.ogg,audio/*,audio/mpeg,audio/mp4">

    <div class="track-title" id="trackName">No track selected</div>

    <audio id="audioElement" controls playsinline></audio>

    <div class="eq-container">
      <div class="eq-group">
        <div class="eq-label">
          <span>Bass (60 Hz)</span>
          <b id="bassVal">0 dB</b>
        </div>
        <input type="range" id="bassSlider" min="-12" max="12" value="0" step="1">
      </div>

      <div class="eq-group">
        <div class="eq-label">
          <span>Mid (1 kHz)</span>
          <b id="midVal">0 dB</b>
        </div>
        <input type="range" id="midSlider" min="-12" max="12" value="0" step="1">
      </div>

      <div class="eq-group">
        <div class="eq-label">
          <span>Treble (3 kHz)</span>
          <b id="trebleVal">0 dB</b>
        </div>
        <input type="range" id="trebleSlider" min="-12" max="12" value="0" step="1">
      </div>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const audio = document.getElementById('audioElement');
    const audioInput = document.getElementById('audioInput');
    const fileBtnText = document.getElementById('fileBtnText');
    const trackName = document.getElementById('trackName');

    const bassSlider = document.getElementById('bassSlider');
    const midSlider = document.getElementById('midSlider');
    const trebleSlider = document.getElementById('trebleSlider');

    const bassVal = document.getElementById('bassVal');
    const midVal = document.getElementById('midVal');
    const trebleVal = document.getElementById('trebleVal');

    let audioCtx = null;
    let sourceNode = null;
    let bassFilter = null;
    let midFilter = null;
    let trebleFilter = null;

    function setupEqualizer() {
      if (audioCtx) return;

      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
      sourceNode = audioCtx.createMediaElementSource(audio);

      bassFilter = audioCtx.createBiquadFilter();
      bassFilter.type = 'lowshelf';
      bassFilter.frequency.value = 60;
      bassFilter.gain.value = Number(bassSlider.value);

      midFilter = audioCtx.createBiquadFilter();
      midFilter.type = 'peaking';
      midFilter.frequency.value = 1000;
      midFilter.Q.value = 1.0;
      midFilter.gain.value = Number(midSlider.value);

      trebleFilter = audioCtx.createBiquadFilter();
      trebleFilter.type = 'highshelf';
      trebleFilter.frequency.value = 3000;
      trebleFilter.gain.value = Number(trebleSlider.value);

      sourceNode.connect(bassFilter);
      bassFilter.connect(midFilter);
      midFilter.connect(trebleFilter);
      trebleFilter.connect(audioCtx.destination);
    }

    audioInput.addEventListener('change', function(e) {
      const file = this.files[0];
      if (file) {
        trackName.textContent = file.name;
        fileBtnText.textContent = "Change Selected Audio";
        audio.src = URL.createObjectURL(file);
        audio.load();
        audio.play().catch(() => {});
      }
    });

    audio.addEventListener('play', () => {
      setupEqualizer();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    });

    bassSlider.addEventListener('input', (e) => {
      bassVal.textContent = `${e.target.value} dB`;
      if (bassFilter) bassFilter.gain.value = Number(e.target.value);
    });

    midSlider.addEventListener('input', (e) => {
      midVal.textContent = `${e.target.value} dB`;
      if (midFilter) midFilter.gain.value = Number(e.target.value);
    });

    trebleSlider.addEventListener('input', (e) => {
      trebleVal.textContent = `${e.target.value} dB`;
      if (trebleFilter) trebleFilter.gain.value = Number(e.target.value);
    });
  </script>
</body>
</html>
