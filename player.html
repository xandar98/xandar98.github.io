<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPod Classic OS</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0d0d;
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* iPod Classic Metallic Chassis */
    .ipod-body {
      width: 100%;
      max-width: 380px;
      height: 96vh;
      max-height: 780px;
      background: linear-gradient(145deg, #e6e6e6, #c5c5c5);
      border-radius: 40px;
      padding: 22px 20px 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8),
                  inset 0 -3px 6px rgba(0, 0, 0, 0.4),
                  0 20px 50px rgba(0, 0, 0, 0.9);
      border: 1px solid #b8b8b8;
    }

    /* Screen Bezel & Display */
    .screen-bezel {
      width: 100%;
      height: 48%;
      background: #000;
      border-radius: 18px;
      padding: 10px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), 0 1px 2px rgba(255,255,255,0.4);
      display: flex;
    }
    .ipod-lcd {
      width: 100%;
      height: 100%;
      background: #fff;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 13px;
      color: #1a1a1a;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.15);
    }

    /* iPod Header Bar */
    .lcd-header {
      height: 24px;
      background: linear-gradient(180deg, #d8d8d8 0%, #b8b8b8 50%, #9e9e9e 51%, #c4c4c4 100%);
      border-bottom: 1px solid #7c7c7c;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      font-weight: 700;
      font-size: 11px;
      color: #222;
      text-shadow: 0 1px 0 rgba(255,255,255,0.6);
    }
    .header-icons {
      display: flex;
      gap: 6px;
      font-size: 10px;
    }

    /* Menu Split Screen Layout */
    .lcd-content {
      flex: 1;
      display: flex;
      position: relative;
      background: #fff;
      overflow: hidden;
    }

    /* Menu View */
    .menu-view {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .menu-list {
      list-style: none;
      flex: 1;
      overflow-y: auto;
    }
    .menu-item {
      padding: 7px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }
    .menu-item.active {
      background: linear-gradient(180deg, #3895e8 0%, #1562b3 100%);
      color: #fff;
    }
    .menu-item .arrow {
      font-size: 10px;
      opacity: 0.7;
    }

    /* Now Playing View */
    .now-playing-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      display: none;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
    }
    .np-top {
      display: flex;
      gap: 12px;
      flex: 1;
      align-items: center;
    }
    .album-art {
      width: 84px;
      height: 84px;
      background: linear-gradient(135deg, #1c1c1c, #444);
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 28px;
    }
    .track-details {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .np-title {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .np-artist, .np-album {
      font-size: 11px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* iPod Scrubber Progress Bar */
    .progress-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-top: 4px;
    }
    .progress-track-wrapper {
      width: 100%;
      height: 14px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .progress-track {
      width: 100%;
      height: 6px;
      background: #d4d4d4;
      border-radius: 3px;
      border: 1px solid #b8b8b8;
      position: relative;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(180deg, #4fa5f5 0%, #176dc7 100%);
      pointer-events: none;
    }
    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 600;
      color: #555;
    }

    /* Equalizer View */
    .eq-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      display: none;
      flex-direction: column;
      padding: 12px;
      gap: 12px;
    }
    .eq-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .eq-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: #333;
    }
    .eq-info span.val {
      color: #176dc7;
    }
    input[type=range] {
      width: 100%;
      accent-color: #1562b3;
      height: 4px;
    }

    /* Volume View */
    .volume-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      gap: 12px;
    }

    /* iPod Click Wheel */
    .click-wheel {
      width: 220px;
      height: 220px;
      background: #f7f7f7;
      border-radius: 50%;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.1),
                  0 4px 10px rgba(0,0,0,0.25),
                  0 0 0 1px #d6d6d6;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }
    .wheel-label {
      position: absolute;
      font-weight: 700;
      font-size: 12px;
      color: #8c8c8c;
      letter-spacing: 0.5px;
      pointer-events: auto;
      cursor: pointer;
    }
    .wheel-menu { top: 16px; }
    .wheel-prev { left: 16px; display: flex; align-items: center; }
    .wheel-next { right: 16px; display: flex; align-items: center; }
    .wheel-play { bottom: 16px; display: flex; align-items: center; }

    /* Center Select Button */
    .center-btn {
      width: 82px;
      height: 82px;
      background: linear-gradient(145deg, #e6e6e6, #d1d1d1);
      border-radius: 50%;
      box-shadow: 0 3px 6px rgba(0,0,0,0.18), inset 0 1px 2px rgba(255,255,255,0.9);
      border: 1px solid #bfbfbf;
      cursor: pointer;
    }
    .center-btn:active {
      background: #c8c8c8;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.25);
    }

    #fileInput {
      display: none;
    }
  </style>
</head>
<body>

  <div class="ipod-body">
    <!-- LCD Bezel Screen -->
    <div class="screen-bezel">
      <div class="ipod-lcd">
        <!-- Title Bar -->
        <div class="lcd-header">
          <span id="headerTitle">iPod</span>
          <div class="header-icons">
            <span id="playStateIcon">⏸</span>
            <span>🔋</span>
          </div>
        </div>

        <!-- Main Screen Content Area -->
        <div class="lcd-content">
          <!-- 1. OS Menu -->
          <div class="menu-view" id="menuView">
            <ul class="menu-list" id="menuList">
              <li class="menu-item active" data-view="nowPlaying">Now Playing <span class="arrow">▶</span></li>
              <li class="menu-item" data-view="openFile">Choose Local Songs <span class="arrow">▶</span></li>
              <li class="menu-item" data-view="equalizer">Equalizer (DSP) <span class="arrow">▶</span></li>
              <li class="menu-item" data-view="volume">Volume Control <span class="arrow">▶</span></li>
            </ul>
          </div>

          <!-- 2. Now Playing Screen -->
          <div class="now-playing-view" id="nowPlayingView">
            <div class="np-top">
              <div class="album-art" id="npArt">🎵</div>
              <div class="track-details">
                <div class="np-title" id="trackName">No song selected</div>
                <div class="np-artist" id="artistName">Apple iPod</div>
                <div class="np-album" id="sourceMeta">Tap Menu to load files</div>
              </div>
            </div>

            <div class="progress-box">
              <div class="progress-track-wrapper" id="progressContainer">
                <div class="progress-track">
                  <div class="progress-fill" id="progressFill"></div>
                </div>
              </div>
              <div class="time-labels">
                <span id="currentTime">0:00</span>
                <span id="totalDuration">0:00</span>
              </div>
            </div>
          </div>

          <!-- 3. Equalizer Screen -->
          <div class="eq-view" id="eqView">
            <div class="eq-row">
              <div class="eq-info"><span>Bass (60Hz)</span><span class="val" id="bassVal">0dB</span></div>
              <input type="range" id="bassSlider" min="-12" max="12" value="0">
            </div>
            <div class="eq-row">
              <div class="eq-info"><span>Mid (1kHz)</span><span class="val" id="midVal">0dB</span></div>
              <input type="range" id="midSlider" min="-12" max="12" value="0">
            </div>
            <div class="eq-row">
              <div class="eq-info"><span>Treble (3kHz)</span><span class="val" id="trebleVal">0dB</span></div>
              <input type="range" id="trebleSlider" min="-12" max="12" value="0">
            </div>
          </div>

          <!-- 4. Volume Screen -->
          <div class="volume-view" id="volumeView">
            <div style="font-weight:700; color:#333; font-size:12px;">Headphone Volume</div>
            <input type="range" id="volSlider" min="0" max="1" step="0.01" value="1" style="width:85%;">
            <div style="font-size:11px; font-weight:700; color:#176dc7;" id="volText">100%</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Click Wheel Area -->
    <div class="click-wheel" id="clickWheel">
      <div class="wheel-label wheel-menu" id="menuBtn">MENU</div>
      <div class="wheel-label wheel-prev" id="prevBtn">|◀◀</div>
      <div class="wheel-label wheel-next" id="nextBtn">▶▶|</div>
      <div class="wheel-label wheel-play" id="playPauseBtn">▶||</div>
      <div class="center-btn" id="centerBtn"></div>
    </div>

    <audio id="audioElement" playsinline crossorigin="anonymous"></audio>
    <input type="file" id="fileInput" accept=".mp3,.m4a,.wav,.aac,.ogg,audio/*" multiple>
  </div>

  <script>
    // Expand Telegram Mini App Fullscreen
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    const audio = document.getElementById('audioElement');
    const fileInput = document.getElementById('fileInput');

    // LCD Views
    const headerTitle = document.getElementById('headerTitle');
    const playStateIcon = document.getElementById('playStateIcon');
    const menuView = document.getElementById('menuView');
    const nowPlayingView = document.getElementById('nowPlayingView');
    const eqView = document.getElementById('eqView');
    const volumeView = document.getElementById('volumeView');

    // Menu list
    const menuItems = Array.from(document.querySelectorAll('.menu-item'));
    let currentMenuIndex = 0;
    let activeView = 'menu'; // 'menu', 'nowPlaying', 'equalizer', 'volume'

    // Track Display
    const trackName = document.getElementById('trackName');
    const artistName = document.getElementById('artistName');
    const sourceMeta = document.getElementById('sourceMeta');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const totalDurationEl = document.getElementById('totalDuration');

    // Equalizer & Volume
    const bassSlider = document.getElementById('bassSlider');
    const midSlider = document.getElementById('midSlider');
    const trebleSlider = document.getElementById('trebleSlider');
    const bassVal = document.getElementById('bassVal');
    const midVal = document.getElementById('midVal');
    const trebleVal = document.getElementById('trebleVal');
    const volSlider = document.getElementById('volSlider');
    const volText = document.getElementById('volText');

    let playlist = [];
    let currentIndex = 0;
    let audioCtx = null, sourceNode = null, bassFilter = null, midFilter = null, trebleFilter = null, gainNode = null;

    // Switch Screens Function
    function showView(view) {
      activeView = view;
      menuView.style.display = 'none';
      nowPlayingView.style.display = 'none';
      eqView.style.display = 'none';
      volumeView.style.display = 'none';

      if (view === 'menu') {
        headerTitle.textContent = 'iPod';
        menuView.style.display = 'flex';
      } else if (view === 'nowPlaying') {
        headerTitle.textContent = 'Now Playing';
        nowPlayingView.style.display = 'flex';
      } else if (view === 'equalizer') {
        headerTitle.textContent = 'Equalizer';
        eqView.style.display = 'flex';
      } else if (view === 'volume') {
        headerTitle.textContent = 'Volume';
        volumeView.style.display = 'flex';
      }
    }

    // Menu Item Selection Update
    function updateMenuSelection(index) {
      menuItems.forEach((item, idx) => {
        item.classList.toggle('active', idx === index);
      });
      currentMenuIndex = index;
    }

    // Audio Equalizer setup
    function setupEqualizer() {
      if (audioCtx) return;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
      sourceNode = audioCtx.createMediaElementSource(audio);

      bassFilter = audioCtx.createBiquadFilter();
      bassFilter.type = 'lowshelf';
      bassFilter.frequency.value = 60;
      bassFilter.gain.value = Number(bassSlider.value);

      midFilter = audioCtx.createBiquadFilter();
      midFilter.type = 'peaking';
      midFilter.frequency.value = 1000;
      midFilter.Q.value = 1.0;
      midFilter.gain.value = Number(midSlider.value);

      trebleFilter = audioCtx.createBiquadFilter();
      trebleFilter.type = 'highshelf';
      trebleFilter.frequency.value = 3000;
      trebleFilter.gain.value = Number(trebleSlider.value);

      gainNode = audioCtx.createGain();
      gainNode.gain.value = Number(volSlider.value);

      sourceNode.connect(bassFilter);
      bassFilter.connect(midFilter);
      midFilter.connect(trebleFilter);
      trebleFilter.connect(gainNode);
      gainNode.connect(audioCtx.destination);
    }

    function formatTime(secs) {
      if (isNaN(secs) || secs < 0) return "0:00";
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function playAudio() {
      setupEqualizer();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      audio.play().then(() => {
        playStateIcon.textContent = '▶';
      }).catch(() => {});
    }

    function pauseAudio() {
      audio.pause();
      playStateIcon.textContent = '⏸';
    }

    // Center Button Click Action
    document.getElementById('centerBtn').addEventListener('click', () => {
      if (activeView === 'menu') {
        const selected = menuItems[currentMenuIndex].dataset.view;
        if (selected === 'openFile') {
          fileInput.click();
        } else {
          showView(selected);
        }
      } else if (activeView === 'nowPlaying') {
        if (!audio.src) return;
        audio.paused ? playAudio() : pauseAudio();
      }
    });

    // MENU Button Action (Back key)
    document.getElementById('menuBtn').addEventListener('click', () => {
      if (activeView !== 'menu') {
        showView('menu');
      }
    });

    // Play/Pause button
    document.getElementById('playPauseBtn').addEventListener('click', () => {
      if (!audio.src) return;
      audio.paused ? playAudio() : pauseAudio();
    });

    // Next / Prev Buttons
    document.getElementById('nextBtn').addEventListener('click', () => {
      if (playlist.length <= 1) return;
      currentIndex = (currentIndex + 1) % playlist.length;
      loadLocalTrack(currentIndex);
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (playlist.length <= 1) return;
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadLocalTrack(currentIndex);
    });

    // Load Local Track
    function loadLocalTrack(index) {
      const file = playlist[index];
      trackName.textContent = file.name;
      artistName.textContent = 'Local Library';
      sourceMeta.textContent = `Song ${index + 1} of ${playlist.length}`;
      audio.src = URL.createObjectURL(file);
      audio.load();
      showView('nowPlaying');
      playAudio();
    }

    fileInput.addEventListener('change', function() {
      if (this.files.length > 0) {
        playlist = Array.from(this.files);
        currentIndex = 0;
        loadLocalTrack(0);
      }
    });

    // Telegram chat direct stream support
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const streamUrl = params.get('stream');
      const songTitle = params.get('title');
      const artist = params.get('artist');

      if (streamUrl) {
        trackName.textContent = songTitle ? decodeURIComponent(songTitle) : "Telegram Audio";
        artistName.textContent = artist ? decodeURIComponent(artist) : "Telegram";
        sourceMeta.textContent = "Streaming from chat";
        audio.src = streamUrl;
        audio.load();
        showView('nowPlaying');
        playAudio();
      }
    });

    // Progress bar touch seeking
    progressContainer.addEventListener('click', (e) => {
      if (!audio.src || isNaN(audio.duration)) return;
      const rect = progressContainer.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      audio.currentTime = pct * audio.duration;
      if (audio.paused) playAudio();
    });

    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${pct}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      totalDurationEl.textContent = formatTime(audio.duration);
    });

    // Equalizer sliders
    bassSlider.addEventListener('input', (e) => {
      bassVal.textContent = `${e.target.value}dB`;
      if (bassFilter) bassFilter.gain.value = Number(e.target.value);
    });
    midSlider.addEventListener('input', (e) => {
      midVal.textContent = `${e.target.value}dB`;
      if (midFilter) midFilter.gain.value = Number(e.target.value);
    });
    trebleSlider.addEventListener('input', (e) => {
      trebleVal.textContent = `${e.target.value}dB`;
      if (trebleFilter) trebleFilter.gain.value = Number(e.target.value);
    });

    // Volume Slider
    volSlider.addEventListener('input', (e) => {
      const v = Number(e.target.value);
      audio.volume = v;
      if (gainNode) gainNode.gain.value = v;
      volText.textContent = `${Math.round(v * 100)}%`;
    });

    // Click Wheel Rotation Detection (Virtual Scroll Wheel)
    const wheel = document.getElementById('clickWheel');
    let lastAngle = null;
    let accumulatedAngle = 0;

    function getAngle(touch, elem) {
      const rect = elem.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      return Math.atan2(touch.clientY - cy, touch.clientX - cx) * (180 / Math.PI);
    }

    wheel.addEventListener('touchstart', (e) => {
      lastAngle = getAngle(e.touches[0], wheel);
      accumulatedAngle = 0;
    }, { passive: true });

    wheel.addEventListener('touchmove', (e) => {
      if (lastAngle === null) return;
      const currentAngle = getAngle(e.touches[0], wheel);
      let diff = currentAngle - lastAngle;

      if (diff > 180) diff -= 360;
      if (diff < -180) diff += 360;

      accumulatedAngle += diff;
      lastAngle = currentAngle;

      // Every 30 degrees of circular rotation moves the menu/volume
      if (Math.abs(accumulatedAngle) >= 28) {
        const step = accumulatedAngle > 0 ? 1 : -1;
        accumulatedAngle = 0;

        if (activeView === 'menu') {
          let nextIndex = currentMenuIndex + step;
          if (nextIndex < 0) nextIndex = menuItems.length - 1;
          if (nextIndex >= menuItems.length) nextIndex = 0;
          updateMenuSelection(nextIndex);
        } else if (activeView === 'volume') {
          let v = Math.max(0, Math.min(1, Number(volSlider.value) + step * 0.05));
          volSlider.value = v;
          audio.volume = v;
          if (gainNode) gainNode.gain.value = v;
          volText.textContent = `${Math.round(v * 100)}%`;
        } else if (activeView === 'nowPlaying' && audio.duration) {
          audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + step * 5));
        }
      }
    }, { passive: true });

    wheel.addEventListener('touchend', () => {
      lastAngle = null;
    });
  </script>
</body>
</html>
