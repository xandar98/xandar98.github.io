<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iPod Classic Ultra Fast</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }
    body {
      background-color: #050505;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Metallic Chassis */
    .ipod-body {
      width: 100%;
      max-width: 380px;
      height: 98vh;
      max-height: 780px;
      background: linear-gradient(145deg, #e7e7e7, #bfbfbf);
      border-radius: 36px;
      padding: 16px 16px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.9),
                  inset 0 -3px 6px rgba(0, 0, 0, 0.45),
                  0 20px 50px rgba(0, 0, 0, 0.95);
      border: 1px solid #b2b2b2;
      will-change: transform;
    }

    /* Screen Bezel & Display */
    .screen-bezel {
      width: 100%;
      height: 48%;
      background: #000;
      border-radius: 16px;
      padding: 8px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.85), 0 1px 2px rgba(255,255,255,0.4);
      display: flex;
    }
    .ipod-lcd {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #f8f9fa 0%, #eef1f5 100%);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 13px;
      color: #1a1a1a;
      border: 1px solid #c2c8d0;
    }

    /* Header Bar */
    .lcd-header {
      height: 22px;
      background: linear-gradient(180deg, #d3d8df 0%, #b2bac5 50%, #9ba5b2 51%, #bac2cd 100%);
      border-bottom: 1px solid #7c8896;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      font-weight: 700;
      font-size: 11px;
      color: #1e252d;
      text-shadow: 0 1px 0 rgba(255,255,255,0.7);
    }
    .header-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .apple-icon {
      width: 12px;
      height: 12px;
      fill: #222;
    }
    .battery-icon {
      width: 18px;
      height: 10px;
      border: 1px solid #333;
      border-radius: 2px;
      position: relative;
      padding: 1px;
    }
    .battery-icon::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 2px;
      width: 2px;
      height: 4px;
      background: #333;
      border-radius: 0 1px 1px 0;
    }
    .battery-fill {
      width: 80%;
      height: 100%;
      background: #27ae60;
      border-radius: 1px;
    }

    /* Screen Views Area */
    .lcd-content {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, #ffffff 0%, #edf0f5 100%);
    }

    /* 1. Menu */
    .menu-view {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .menu-list {
      list-style: none;
      flex: 1;
      overflow-y: auto;
    }
    .menu-item {
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      border-bottom: 1px solid #e2e6eb;
      cursor: pointer;
    }
    .menu-item.active {
      background: linear-gradient(180deg, #378fe6 0%, #175bb3 100%);
      color: #fff;
    }
    .menu-item .arrow-svg {
      width: 8px;
      height: 8px;
      fill: currentColor;
    }

    /* 2. Now Playing */
    .now-playing-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
    }
    .np-top {
      display: flex;
      gap: 12px;
      flex: 1;
      align-items: center;
    }
    .album-art {
      width: 84px;
      height: 84px;
      background: linear-gradient(135deg, #1b2430 0%, #3a4b61 100%);
      border-radius: 4px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.4);
    }
    .album-art svg {
      width: 36px;
      height: 36px;
      fill: #a0aec0;
    }
    .track-details {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .np-title {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #111;
    }
    .np-artist, .np-album {
      font-size: 11px;
      color: #555;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Scrubber */
    .progress-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .progress-track-wrapper {
      width: 100%;
      height: 16px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .progress-track {
      width: 100%;
      height: 6px;
      background: #c8ced6;
      border-radius: 3px;
      border: 1px solid #a8b0ba;
      position: relative;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(180deg, #4da4f7 0%, #1566be 100%);
      pointer-events: none;
    }
    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 600;
      color: #444;
    }

    /* 3. Equalizer */
    .eq-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      padding: 10px 14px;
      gap: 10px;
    }
    .eq-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 4px 6px;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: background 0.05s ease;
    }
    .eq-row.active {
      background: rgba(55, 143, 230, 0.16);
      border: 1px solid #378fe6;
    }
    .eq-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: #222;
    }
    .eq-info span.val {
      color: #175bb3;
      font-family: monospace;
    }
    .eq-hint {
      font-size: 9px;
      color: #666;
      text-align: center;
      margin-top: auto;
      font-weight: 600;
    }

    /* 4. Volume */
    .volume-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      gap: 12px;
    }
    .vol-track {
      width: 85%;
      height: 8px;
      background: #c8ced6;
      border: 1px solid #a8b0ba;
      border-radius: 4px;
      overflow: hidden;
    }
    .vol-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #4da4f7 0%, #1566be 100%);
    }

    /* Ultra-Responsive Click-Wheel */
    .click-wheel {
      width: 220px;
      height: 220px;
      background: #f7f7f7;
      border-radius: 50%;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.1),
                  0 4px 10px rgba(0,0,0,0.25),
                  0 0 0 1px #d6d6d6;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
    }
    .wheel-label {
      position: absolute;
      font-weight: 700;
      font-size: 12px;
      color: #8c8c8c;
      letter-spacing: 0.5px;
      padding: 14px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .wheel-label:active {
      color: #175bb3;
      transform: scale(0.92);
    }
    .wheel-menu { top: 4px; }
    .wheel-prev { left: 4px; }
    .wheel-next { right: 4px; }
    .wheel-play { bottom: 4px; }
    .wheel-label svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Center Select Button */
    .center-btn {
      width: 80px;
      height: 80px;
      background: linear-gradient(145deg, #e6e6e6, #d1d1d1);
      border-radius: 50%;
      box-shadow: 0 3px 6px rgba(0,0,0,0.18), inset 0 1px 2px rgba(255,255,255,0.9);
      border: 1px solid #bfbfbf;
      cursor: pointer;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #777;
    }
    .center-btn:active {
      background: #c8c8c8;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.25);
      transform: scale(0.96);
    }

    #fileInput {
      display: none;
    }
  </style>
</head>
<body>

  <div class="ipod-body">
    <div class="screen-bezel">
      <div class="ipod-lcd">
        <div class="lcd-header">
          <span id="headerTitle">iPod</span>
          <div class="header-icons">
            <svg id="playStateSvg" class="apple-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            <div class="battery-icon"><div class="battery-fill"></div></div>
          </div>
        </div>

        <div class="lcd-content">
          <!-- 1. Menu Screen -->
          <div class="menu-view" id="menuView">
            <ul class="menu-list" id="menuList">
              <li class="menu-item active" data-view="nowPlaying">
                <span>Now Playing</span>
                <svg class="arrow-svg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </li>
              <li class="menu-item" data-view="openFile">
                <span>Choose Local Songs</span>
                <svg class="arrow-svg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </li>
              <li class="menu-item" data-view="equalizer">
                <span>Equalizer (DSP)</span>
                <svg class="arrow-svg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </li>
              <li class="menu-item" data-view="volume">
                <span>Volume Control</span>
                <svg class="arrow-svg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              </li>
            </ul>
          </div>

          <!-- 2. Now Playing Screen -->
          <div class="now-playing-view" id="nowPlayingView">
            <div class="np-top">
              <div class="album-art" id="npArt">
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
              </div>
              <div class="track-details">
                <div class="np-title" id="trackName">No song loaded</div>
                <div class="np-artist" id="artistName">Apple iPod</div>
                <div class="np-album" id="sourceMeta">Scroll wheel to browse</div>
              </div>
            </div>

            <div class="progress-box">
              <div class="progress-track-wrapper" id="progressContainer">
                <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
              </div>
              <div class="time-labels">
                <span id="currentTime">0:00</span>
                <span id="totalDuration">0:00</span>
              </div>
            </div>
          </div>

          <!-- 3. Equalizer Screen -->
          <div class="eq-view" id="eqView">
            <div class="eq-row active" id="eqRowBass">
              <div class="eq-info"><span>Bass (60Hz)</span><span class="val" id="bassVal">0dB</span></div>
            </div>
            <div class="eq-row" id="eqRowMid">
              <div class="eq-info"><span>Mid (1kHz)</span><span class="val" id="midVal">0dB</span></div>
            </div>
            <div class="eq-row" id="eqRowTreble">
              <div class="eq-info"><span>Treble (3kHz)</span><span class="val" id="trebleVal">0dB</span></div>
            </div>
            <div class="eq-hint">Center: Switch Band • Wheel: Fast Gain</div>
          </div>

          <!-- 4. Volume Screen -->
          <div class="volume-view" id="volumeView">
            <div style="font-weight:700; color:#333; font-size:12px;">Headphone Volume</div>
            <div class="vol-track"><div class="vol-fill" id="volFill"></div></div>
            <div style="font-size:11px; font-weight:700; color:#175bb3;" id="volText">100%</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Ultra Sensitive Click Wheel -->
    <div class="click-wheel" id="clickWheel">
      <div class="wheel-label wheel-menu" id="menuBtn">MENU</div>
      <div class="wheel-label wheel-prev" id="prevBtn">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </div>
      <div class="wheel-label wheel-next" id="nextBtn">
        <svg viewBox="0 0 24 24"><path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </div>
      <div class="wheel-label wheel-play" id="playPauseBtn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7zM6 19h2V5H6v14zm10-14v14h2V5h-2z"/></svg>
      </div>
      <div class="center-btn" id="centerBtn">SELECT</div>
    </div>

    <audio id="audioElement" playsinline crossorigin="anonymous"></audio>
    <input type="file" id="fileInput" accept=".mp3,.m4a,.wav,.aac,.ogg,audio/*" multiple>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      if (typeof tg.isVerticalSwipesEnabled !== 'undefined') {
        tg.isVerticalSwipesEnabled = false;
      }
      tg.enableClosingConfirmation && tg.enableClosingConfirmation();
    }

    // High performance Click / Haptic feedback generator
    function triggerHaptic() {
      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }
    }

    document.body.addEventListener('touchmove', (e) => {
      e.preventDefault();
    }, { passive: false });

    const audio = document.getElementById('audioElement');
    const fileInput = document.getElementById('fileInput');

    const headerTitle = document.getElementById('headerTitle');
    const playStateSvg = document.getElementById('playStateSvg');
    const menuView = document.getElementById('menuView');
    const nowPlayingView = document.getElementById('nowPlayingView');
    const eqView = document.getElementById('eqView');
    const volumeView = document.getElementById('volumeView');

    const menuItems = Array.from(document.querySelectorAll('.menu-item'));
    let currentMenuIndex = 0;
    let activeView = 'menu';

    const trackName = document.getElementById('trackName');
    const artistName = document.getElementById('artistName');
    const sourceMeta = document.getElementById('sourceMeta');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const totalDurationEl = document.getElementById('totalDuration');

    const eqRows = [
      document.getElementById('eqRowBass'),
      document.getElementById('eqRowMid'),
      document.getElementById('eqRowTreble')
    ];
    let selectedEqBand = 0;
    let eqGains = { bass: 0, mid: 0, treble: 0 };

    const bassVal = document.getElementById('bassVal');
    const midVal = document.getElementById('midVal');
    const trebleVal = document.getElementById('trebleVal');
    const volFill = document.getElementById('volFill');
    const volText = document.getElementById('volText');

    let currentVolume = 1;
    let playlist = [];
    let currentIndex = 0;
    let audioCtx = null, sourceNode = null, bassFilter = null, midFilter = null, trebleFilter = null, gainNode = null;

    function showView(view) {
      activeView = view;
      menuView.style.display = 'none';
      nowPlayingView.style.display = 'none';
      eqView.style.display = 'none';
      volumeView.style.display = 'none';

      if (view === 'menu') {
        headerTitle.textContent = 'iPod';
        menuView.style.display = 'flex';
      } else if (view === 'nowPlaying') {
        headerTitle.textContent = 'Now Playing';
        nowPlayingView.style.display = 'flex';
      } else if (view === 'equalizer') {
        headerTitle.textContent = 'Equalizer';
        eqView.style.display = 'flex';
        updateEqRowHighlight();
      } else if (view === 'volume') {
        headerTitle.textContent = 'Volume';
        volumeView.style.display = 'flex';
      }
    }

    function updateMenuSelection(index) {
      menuItems[currentMenuIndex].classList.remove('active');
      menuItems[index].classList.add('active');
      currentMenuIndex = index;
    }

    function updateEqRowHighlight() {
      eqRows.forEach((row, idx) => {
        row.classList.toggle('active', idx === selectedEqBand);
      });
    }

    // Helper for ZERO-LATENCY TOUCH HANDLING (No 300ms click delay)
    function bindInstantTouch(element, callback) {
      let triggered = false;
      element.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        e.preventDefault();
        triggered = true;
        triggerHaptic();
        callback();
      });
      element.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!triggered) callback();
        triggered = false;
      });
    }

    // Instant Center Button Action
    bindInstantTouch(document.getElementById('centerBtn'), () => {
      if (activeView === 'menu') {
        const selected = menuItems[currentMenuIndex].dataset.view;
        if (selected === 'openFile') {
          fileInput.click();
        } else {
          showView(selected);
        }
      } else if (activeView === 'nowPlaying') {
        if (!audio.src) return;
        audio.paused ? playAudio() : pauseAudio();
      } else if (activeView === 'equalizer') {
        selectedEqBand = (selectedEqBand + 1) % 3;
        updateEqRowHighlight();
      }
    });

    // Instant Menu Button (Back)
    bindInstantTouch(document.getElementById('menuBtn'), () => {
      if (activeView !== 'menu') {
        showView('menu');
      }
    });

    // Instant Play / Pause
    bindInstantTouch(document.getElementById('playPauseBtn'), () => {
      if (!audio.src) return;
      audio.paused ? playAudio() : pauseAudio();
    });

    // Instant Next / Prev
    bindInstantTouch(document.getElementById('nextBtn'), () => {
      if (playlist.length <= 1) return;
      currentIndex = (currentIndex + 1) % playlist.length;
      loadLocalTrack(currentIndex);
    });

    bindInstantTouch(document.getElementById('prevBtn'), () => {
      if (playlist.length <= 1) return;
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadLocalTrack(currentIndex);
    });

    // Web Audio DSP Equalizer
    function setupEqualizer() {
      if (audioCtx) return;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();
      sourceNode = audioCtx.createMediaElementSource(audio);

      bassFilter = audioCtx.createBiquadFilter();
      bassFilter.type = 'lowshelf';
      bassFilter.frequency.value = 60;
      bassFilter.gain.value = eqGains.bass;

      midFilter = audioCtx.createBiquadFilter();
      midFilter.type = 'peaking';
      midFilter.frequency.value = 1000;
      midFilter.Q.value = 1.0;
      midFilter.gain.value = eqGains.mid;

      trebleFilter = audioCtx.createBiquadFilter();
      trebleFilter.type = 'highshelf';
      trebleFilter.frequency.value = 3000;
      trebleFilter.gain.value = eqGains.treble;

      gainNode = audioCtx.createGain();
      gainNode.gain.value = currentVolume;

      sourceNode.connect(bassFilter);
      bassFilter.connect(midFilter);
      midFilter.connect(trebleFilter);
      trebleFilter.connect(gainNode);
      gainNode.connect(audioCtx.destination);
    }

    function formatTime(secs) {
      if (isNaN(secs) || secs < 0) return "0:00";
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function playAudio() {
      setupEqualizer();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      audio.play().then(() => {
        playStateSvg.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }).catch(() => {});
    }

    function pauseAudio() {
      audio.pause();
      playStateSvg.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    }

    function loadLocalTrack(index) {
      const file = playlist[index];
      trackName.textContent = file.name;
      artistName.textContent = 'Local Library';
      sourceMeta.textContent = `Song ${index + 1} of ${playlist.length}`;
      audio.src = URL.createObjectURL(file);
      audio.load();
      showView('nowPlaying');
      playAudio();
    }

    fileInput.addEventListener('change', function() {
      if (this.files.length > 0) {
        playlist = Array.from(this.files);
        currentIndex = 0;
        loadLocalTrack(0);
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const streamUrl = params.get('stream');
      const songTitle = params.get('title');
      const artist = params.get('artist');

      if (streamUrl) {
        trackName.textContent = songTitle ? decodeURIComponent(songTitle) : "Telegram Audio";
        artistName.textContent = artist ? decodeURIComponent(artist) : "Telegram";
        sourceMeta.textContent = "Streaming from chat";
        audio.src = streamUrl;
        audio.load();
        showView('nowPlaying');
        playAudio();
      }
    });

    // Ultra Fast Scrubber Seeking
    function seekFromEvent(e) {
      if (!audio.src || isNaN(audio.duration)) return;
      const rect = progressContainer.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      audio.currentTime = pct * audio.duration;
      progressFill.style.width = `${pct * 100}%`;
      currentTimeEl.textContent = formatTime(audio.currentTime);
      if (audio.paused) playAudio();
    }

    progressContainer.addEventListener('pointerdown', (e) => {
      seekFromEvent(e);
      triggerHaptic();
    });

    audio.addEventListener('timeupdate', () => {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${pct}%`;
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      totalDurationEl.textContent = formatTime(audio.duration);
    });

    // ULTRA SENSITIVE ROTATING CLICK-WHEEL (Threshold 8 deg)
    const wheel = document.getElementById('clickWheel');
    let lastAngle = null;
    let accumulatedAngle = 0;

    function getAngle(touch, elem) {
      const rect = elem.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      return Math.atan2(touch.clientY - cy, touch.clientX - cx) * (180 / Math.PI);
    }

    wheel.addEventListener('touchstart', (e) => {
      lastAngle = getAngle(e.touches[0], wheel);
      accumulatedAngle = 0;
    }, { passive: false });

    wheel.addEventListener('touchmove', (e) => {
      e.preventDefault();
      e.stopPropagation();

      if (lastAngle === null) return;
      const currentAngle = getAngle(e.touches[0], wheel);
      let diff = currentAngle - lastAngle;

      if (diff > 180) diff -= 360;
      if (diff < -180) diff += 360;

      accumulatedAngle += diff;
      lastAngle = currentAngle;

      // Sensitive threshold: fires every 8 degrees for instant fluid response
      if (Math.abs(accumulatedAngle) >= 8) {
        const step = accumulatedAngle > 0 ? 1 : -1;
        accumulatedAngle = 0;
        triggerHaptic(); // Tactile tick feedback

        if (activeView === 'menu') {
          let nextIndex = currentMenuIndex + step;
          if (nextIndex < 0) nextIndex = menuItems.length - 1;
          if (nextIndex >= menuItems.length) nextIndex = 0;
          updateMenuSelection(nextIndex);
        } else if (activeView === 'volume') {
          currentVolume = Math.max(0, Math.min(1, currentVolume + step * 0.03));
          audio.volume = currentVolume;
          if (gainNode) gainNode.gain.value = currentVolume;
          volFill.style.width = `${currentVolume * 100}%`;
          volText.textContent = `${Math.round(currentVolume * 100)}%`;
        } else if (activeView === 'equalizer') {
          setupEqualizer();
          if (selectedEqBand === 0) {
            eqGains.bass = Math.max(-12, Math.min(12, eqGains.bass + step));
            bassVal.textContent = `${eqGains.bass > 0 ? '+' : ''}${eqGains.bass}dB`;
            if (bassFilter) bassFilter.gain.value = eqGains.bass;
          } else if (selectedEqBand === 1) {
            eqGains.mid = Math.max(-12, Math.min(12, eqGains.mid + step));
            midVal.textContent = `${eqGains.mid > 0 ? '+' : ''}${eqGains.mid}dB`;
            if (midFilter) midFilter.gain.value = eqGains.mid;
          } else if (selectedEqBand === 2) {
            eqGains.treble = Math.max(-12, Math.min(12, eqGains.treble + step));
            trebleVal.textContent = `${eqGains.treble > 0 ? '+' : ''}${eqGains.treble}dB`;
            if (trebleFilter) trebleFilter.gain.value = eqGains.treble;
          }
        } else if (activeView === 'nowPlaying' && audio.duration) {
          audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + step * 2));
        }
      }
    }, { passive: false });

    wheel.addEventListener('touchend', () => { lastAngle = null; });
    wheel.addEventListener('touchcancel', () => { lastAngle = null; });
  </script>
</body>
</html>
